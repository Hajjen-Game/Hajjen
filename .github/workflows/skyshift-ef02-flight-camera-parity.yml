name: SKYSHIFT EF02 flight camera parity
on:
  pull_request:
    paths:
      - 'skyshift/cinematic-v*.mjs'
      - 'skyshift/flight/cinematic*.mjs'
      - 'skyshift/flight/unified-flight*.mjs'
      - 'skyshift/trial-v0150.mjs'
      - 'skyshift/trial-v0151.mjs'
      - 'skyshift/flight/historical-skyline-trial.mjs'
      - 'skyshift/tests/architecture/ef02h-path-overlay.mjs'
      - 'skyshift/flight/boost/boost-v015*.mjs'
      - 'skyshift/flight/boost/boost-v0160.mjs'
      - 'skyshift/flight/boost/grouped-boost.mjs'
      - 'skyshift/tests/architecture/barrier-boost-migration-stageJ.test.mjs'
      - 'skyshift/tests/architecture/ef02-flight-camera-parity.mjs'
      - 'skyshift/tests/architecture/flight-migration-stageH.test.mjs'
      - '.github/workflows/skyshift-ef02-flight-camera-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flight-camera-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare camera and presentation to exact EF01
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4983f20f6cf867f91e1ebd57ad48b1d0c685997c
          git worktree add --detach "$RUNNER_TEMP/ef02-reference" 4983f20f6cf867f91e1ebd57ad48b1d0c685997c
          node --test skyshift/tests/architecture/flight-migration-stageH.test.mjs
          for track in skyline vault aurora; do
            node skyshift/tests/architecture/ef02-flight-camera-parity.mjs "$RUNNER_TEMP/ef02-reference" "$track"
          done
