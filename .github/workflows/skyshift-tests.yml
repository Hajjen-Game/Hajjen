  # Current release is validated separately; old version baselines stay intact.
  cinematic-phase-a-tests:
    name: SKYSHIFT 0.21.0 Phase A geometry and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Phase A code and geometry
        run: |
          node --check skyshift/cinematic-hero-v0210.mjs
          node --check skyshift/game-v0210.mjs
          node --check skyshift/boot-v0210.js
          node --test skyshift/cinematic-hero-v0210.test.mjs

  browser-neon-smoke:
    name: Premium Integrated Neon 0.20.4 Chrome WebGL
    needs: track-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify SKYSHIFT 0.20.4 integrated neon on graphite and 4GB mobile WebGL
        run: node skyshift/browser-environment-art-v0204.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyshift-v0204-premium-neon-qa
          path: |
            skyshift-v0204-closed-hall.png
            skyshift-v0204-panorama.png
            skyshift-v0204-sidewall.png
            skyshift-v0204-classic-before-neon.png
            skyshift-v0204-mobile.png

