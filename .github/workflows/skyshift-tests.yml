name: SKYSHIFT track logic checks
on:
  push:
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-tests.yml'
  pull_request:
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-tests.yml'
jobs:
  track-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: |
          node --check skyshift/game.mjs
          node --check skyshift/track.mjs
          node --check skyshift/game-v02.mjs
          node --check skyshift/trial-v02.mjs
          node --check skyshift/fullscreen-v02.mjs
          node --check skyshift/trial-v03.mjs
          node --check skyshift/game-v03.mjs
          node --check skyshift/premium-v03.mjs
          node --check skyshift/neon-v031.mjs
          node --check skyshift/premium-v031.mjs
          node --check skyshift/game-v031.mjs
          node --check skyshift/neon-balance-v032.mjs
          node --check skyshift/neon-v032.mjs
          node --check skyshift/premium-v032.mjs
          node --check skyshift/game-v032.mjs
          node --check skyshift/identity-v033.mjs
          node --check skyshift/game-v033.mjs
          node --check skyshift/luminance-v0331.mjs
          node --check skyshift/identity-v0331.mjs
          node --check skyshift/game-v0331.mjs
          node --check skyshift/identity-v034.mjs
          node --check skyshift/world-v034.mjs
          node --check skyshift/ship-v034.mjs
          node --check skyshift/game-v034.mjs
          node --check skyshift/trial-v04.mjs
          node --check skyshift/identity-v04.mjs
          node --check skyshift/space-v04.mjs
          node --check skyshift/game-v04.mjs
          node --check skyshift/trial-v041.mjs
          node --check skyshift/identity-v041.mjs
          node --check skyshift/premium-v041.mjs
          node --check skyshift/game-v041.mjs
          node --check skyshift/trial-v042.mjs
          node --check skyshift/identity-v042.mjs
          node --check skyshift/game-v042.mjs
          node --check skyshift/trial-v043.mjs
          node --check skyshift/smooth-track-v043.mjs
          node --check skyshift/frame-pacing-v043.mjs
          node --check skyshift/neon-v043.mjs
          node --check skyshift/game-v043.mjs
          node --check skyshift/flight-motion-v044.mjs
          node --check skyshift/frame-pacing-v044.mjs
          node --check skyshift/game-v044.mjs
          node --check skyshift/cinematic-v045.mjs
          node --check skyshift/premium-v045.mjs
          node --check skyshift/game-v045.mjs
          node --check skyshift/trial-v046.mjs
          node --check skyshift/smooth-track-v046.mjs
          node --check skyshift/identity-v046.mjs
          node --check skyshift/game-v046.mjs
          node --check skyshift/aero-barrier-v047.mjs
          node --check skyshift/game-v047.mjs
          node --check skyshift/boost-v048.mjs
          node --check skyshift/trial-v048.mjs
          node --check skyshift/zone-surface-v048.mjs
          node --check skyshift/game-v048.mjs
          node --check skyshift/premium-track-v0481.mjs
          node --check skyshift/game-v0481.mjs
          node --check skyshift/premium-ship-v0482.mjs
          node --check skyshift/premium-track-v0482.mjs
          node --check skyshift/game-v0482.mjs
          node --check skyshift/browser-smoke-v0482.mjs
          node --check skyshift/manta-blade-v0483.mjs
          node --check skyshift/game-v0483.mjs
          node --check skyshift/browser-smoke-v0483.mjs
          node --check skyshift/manta-blade-v0484.mjs
          node --check skyshift/engine-trails-v0484.mjs
          node --check skyshift/game-v0484.mjs
          node --check skyshift/browser-smoke-v0484.mjs
          node --check skyshift/browser-smoke-v0481.mjs
      - name: Verify SKYSHIFT deterministic track planner
        run: node --test skyshift/track.test.mjs skyshift/trial-v02.test.mjs skyshift/fullscreen-v02.test.mjs skyshift/trial-v03.test.mjs skyshift/neon-v031.test.mjs skyshift/neon-v032.test.mjs skyshift/identity-v033.test.mjs skyshift/luminance-v0331.test.mjs skyshift/clean-v034.test.mjs skyshift/flow-v04.test.mjs skyshift/truebank-v041.test.mjs skyshift/handling-v042.test.mjs skyshift/speed-v043.test.mjs skyshift/flight-motion-v044.test.mjs skyshift/cinematic-v045.test.mjs skyshift/track-flow-v046.test.mjs skyshift/aero-barrier-v047.test.mjs skyshift/boost-zone-v048.test.mjs skyshift/premium-track-v0481.test.mjs skyshift/premium-ship-v0482.test.mjs skyshift/manta-blade-v0483.test.mjs skyshift/hard-edge-v0484.test.mjs

  browser-smoke:
    name: Premium material WebGL smoke
    needs: track-tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Render SKYSHIFT 0.4.8.4 in headless Chrome WebGL
        run: node skyshift/browser-smoke-v0484.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyshift-v0484-browser-smoke
          path: skyshift-v0484-browser-smoke.png
          if-no-files-found: ignore
