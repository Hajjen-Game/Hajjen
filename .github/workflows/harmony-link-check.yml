name: Japanese Harmony public link check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/harmony-link-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public URL and assets
        shell: bash
        run: |
          set -euo pipefail
          root='https://hajjen-game.github.io/Hajjen/daisugi-bloom/'
          echo "Testing $root"
          curl -L --retry 5 --retry-delay 5 --max-time 30 --fail --show-error --silent --output /tmp/harmony.html "$root"
          grep -iq 'Japanese Harmony' /tmp/harmony.html
          echo 'PASS: public game page reachable'
          for path in harmony/app.js harmony/rules.js harmony/mobile-game.css; do
            code=$(curl -L --retry 4 --retry-delay 3 --max-time 20 --silent --output /tmp/asset --write-out '%{http_code}' "$root$path")
            echo "$path HTTP $code"
            test "$code" = '200' && test -s /tmp/asset
          done
          echo 'PASS: essential assets reachable'
