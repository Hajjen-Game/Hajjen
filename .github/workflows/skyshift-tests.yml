        run: node skyshift/browser-environment-art-v0200.mjs
      - name: Verify SKYSHIFT 0.20.1 enclosed station shell and mobile in real WebGL
        run: node skyshift/browser-environment-art-v0201.mjs
      - name: Verify SKYSHIFT 0.20.2 observation windows A/B and mobile WebGL
