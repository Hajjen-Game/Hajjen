<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#222820">
  <meta name="hajjen-build" content="2d-v0.1-ground-variations-20260824">
  <title>HAJJEN 2D v0.1</title>
  <link rel="stylesheet" href="css/game-2d.css?v=20260821-1723">
  <link rel="stylesheet" href="css/spellbook.css?v=20260821-1723">
</head>
<body>
  <main id="gameShell" aria-label="HAJJEN 2D v0.1">
    <canvas id="gameCanvas" aria-label="The Crossroads exploration world"></canvas>

    <div id="hud2d">
      <div class="hudTop">
        <div class="badge2d"><strong>The Crossroads</strong><span>HAJJEN 2D v0.1 · seamless world prototype</span></div>
        <div class="controls2d">
          <button id="invBtn">Backpack [I]</button>
          <button id="bookBtn">Spellbook [B]</button>
        </div>
      </div>
      <div id="hint" class="hint2d"></div>
    </div>

    <div id="debugPanel" hidden></div>

    <section id="inventory" class="panel" aria-label="Sharkan's Backpack">
      <div class="head"><h2>Sharkan's Backpack</h2><button class="btn close">Close [I]</button></div>
      <div class="body"><div id="inventoryGrid" class="inventoryGrid"></div></div>
    </section>

    <section id="spellbook" class="panel" aria-label="Spellbook">
      <div class="head"><h2>Spellbook</h2><button class="btn close">Close [B]</button></div>
      <div class="body">
        <p class="spellbookIntro">The Spellbook system is preserved while the new seamless 2D overworld foundation is established.</p>
        <div id="spellSlots"></div>
        <div class="tags spellbookNote">Spell experimentation will be expanded after the world foundation is validated.</div>
      </div>
    </section>
  </main>
  <script type="module" src="js/2d/main.js?v=ground-variations-20260824"></script>
</body>
</html>
