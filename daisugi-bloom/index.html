<!doctype html>
<html lang="sv">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="theme-color" content="#f4e5d0">
 <meta name="description" content="Japanese Harmony – förädla japanska föremål och skapa Harmony Pulse-kedjor.">
 <link rel="icon" href="./favicon.svg" type="image/svg+xml">
 <title>Japanese Harmony · Washi Zen 1.0</title>
 <link rel="stylesheet" href="./harmony/styles.css?v=6.24.0-core-clarity">
 <link rel="stylesheet" href="./harmony/mobile-game.css?v=6.50.0-omamori-cards">
 <link rel="stylesheet" href="./harmony/washi-zen.css?v=1.0.0">
 <script defer src="./harmony/rules.js?v=6.47.1-sealed-pulse"></script>
 <script defer src="./harmony/performance.js?v=5.6.0"></script>
 <script defer src="./harmony/audio.js?v=5.6.0"></script>
 <script defer src="./harmony/diagnostics.js?v=6.47.0-director4"></script>
 <script defer src="./harmony/goshuincho.js?v=6.43.0-japanese-numerals"></script>
 <script defer src="./harmony/economy.js?v=6.37.0"></script>
  <script defer src="./harmony/spirits.js?v=6.48.0-identity-bond"></script>
  <script defer src="./harmony/powers.js?v=6.50.0-tiered"></script>
  <script defer src="./harmony/cards.js?v=6.50.0-consumable"></script>
 <script defer src="./harmony/fortune.js?v=6.38.0"></script>
 <script defer src="./harmony/app.js?v=6.50.0-consumable"></script>
</head>
<body>
 <img id="festivalBackdrop" class="festival-backdrop"
      src="./assets/backgrounds/festival-hd-1.avif"
      alt="" aria-hidden="true" decoding="async" fetchpriority="high">
 <div id="app">
  <header class="topbar">
   <button id="homeButton" class="brand" aria-label="Öppna Goshuincho nivåval"><span class="brand-flower">✿</span><span>JAPANESE <strong>HARMONY</strong></span></button>
   <div class="top-actions"><button id="helpButton" class="secondary small">Så spelar du</button><button id="devButton" class="secondary small dev-shortcut" aria-label="Game Dev Motorlab">Game Dev</button><button id="settingsButton" class="icon-button" aria-label="Inställningar">⚙</button></div>
  </header>
  <main>
   <section id="menuView" class="menu-view washi-home" aria-label="Japanese Harmony startsida">
    <div class="washi-home-logo" role="img" aria-label="Japanese Harmony">
      <span class="washi-home-kanji" lang="ja">和</span><span class="washi-home-seal" lang="ja">日本</span>
      <span class="washi-home-name">JAPANESE <small>HARMONY</small></span>
      <span class="washi-home-rule" aria-hidden="true">──── ✿ ────</span>
    </div>
    <div class="washi-home-controls">
      <button type="button" id="continueButton" class="washi-play-main"><span lang="ja">プレイ</span><strong>SPELA</strong></button>
      <div class="washi-home-links" aria-label="Samling och belöningar">
        <button type="button" id="goshuinButton" class="washi-home-link">
          <span class="washi-link-illustration" aria-hidden="true">▤</span><span lang="ja">御朱印帳</span><strong>GOSHUINCHO</strong><small id="goshuinProgress">0 stämplar</small>
        </button>
        <button type="button" id="omamoriButton" class="washi-home-link">
          <span class="washi-link-illustration" aria-hidden="true">守</span><span lang="ja">お守り</span><strong>OMAMORI</strong><small id="omamoriProgress">Kort</small><span id="harmonyCoins" class="washi-wallet">0 mynt</span>
        </button>
        <button type="button" id="omikujiButton" class="washi-home-link">
          <span class="washi-link-illustration" aria-hidden="true">⛩</span><span lang="ja">おみくじ</span><strong>OMIKUJI</strong><small id="omikujiStatus">Lyckolapp</small>
        </button>
      </div>
      <details class="washi-advanced" id="menuAdvanced">
        <summary>Spelinställningar</summary>
        <label for="gameDirectorMode">SPELMOTOR</label>
        <select id="gameDirectorMode" aria-label="Välj Director-läge för nya spel">
          <option value="auto" selected>Automatiskt · 4.0 från nivå 10</option>
          <option value="v4">Harmony Director 4.0 · test</option>
          <option value="v3">Harmony Pacing Director 3.0</option>
          <option value="v31">Objective Awareness Director 3.1</option>
          <option value="v311">Endgame Objective Awareness 3.1.1</option>
          <option value="v2">Opportunity Director 2.0</option>
          <option value="standard">Standard</option>
        </select>
        <p id="directorModeDescription">3.0 på nivå 1–9 och 4.0 från nivå 10.</p>
      </details>
    </div>
    <div id="levelList" class="level-list" hidden inert aria-hidden="true"></div>
    <nav id="levelPager" class="level-pager" hidden inert aria-hidden="true"></nav>
  </section>
  <section id="gameView" class="game-view" hidden>
    <div class="game-heading" aria-label="Spelstatus">
     <div class="moves"><span>DRAG KVAR</span><strong id="movesCount">24</strong></div>
     <div id="scorePanel" class="hud-score score-panel">
      <span class="hud-label">BONUSPOÄNG</span>
      <strong id="scoreCount">0</strong>
      <div class="hud-score-footer"><span id="statusStars" class="star-mini" aria-label="Nivån klarad"></span><span class="hud-record">REKORD <strong id="scoreBest">0</strong></span></div>
     </div>
     <button id="pauseButton" class="pause-button" aria-label="Öppna spelmenyn" title="Spelmeny">Ⅱ</button>
    </div>
    <div id="paceStatus" class="pace-status" aria-live="off">PACING 3.0 · BYGGER</div>
    <div class="game-meta"><span class="eyebrow" id="levelNumber">NIVÅ 1 AV 10</span><strong id="levelTitle">First Match</strong></div>
     <div id="spiritBadge" class="spirit-badge" hidden aria-live="polite"></div>
    <div class="goal"><span class="goal-glyph" aria-hidden="true">✿</span><span id="goalLabel">Fusioner</span><strong id="goalProgress">0 / 5</strong></div>
    <div id="starTargets" class="star-targets" aria-label="Historiska poängkrav för sparade äldre nivåer" hidden>
     <span></span><span></span><span></span>
    </div>
    <div id="omamoriPowerBar" class="omamori-power-bar" hidden aria-label="Omamori-krafter"></div>
     <div class="board-shell">
     <div id="board" class="board" role="grid" aria-label="Spelplan med 7 gånger 7 japanska föremål"></div>
     <div id="resonanceLinks" class="resonance-links" aria-hidden="true"></div>
     <div id="boardPraise" class="board-praise" aria-hidden="true"></div>
    </div>
    <section class="masterpiece-collection" aria-label="Mästerverk samlade under denna nivå">
     <div class="collection-heading"><strong>✦ MÄSTERVERK</strong><span>Bonus för varje mästerverk</span></div>
     <div id="masterpieceCollection" class="collection-items" aria-live="off"></div>
    </section>
    <p id="selectedInfo" class="sr-only" role="status" aria-live="polite">Välj två grannar eller svep.</p>
   </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal" class="modal" hidden>
   <section class="modal-inner" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
     <div class="eyebrow" id="modalEyebrow">HARMONY</div><h2 id="modalTitle"></h2>
     <div id="modalContent"></div>
     <div id="modalActions" class="modal-actions"></div>
   </section>
  </div>
 </div>
</body>
</html>
