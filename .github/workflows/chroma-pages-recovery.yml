name: CHROMA RUSH Pages recovery

# Recovery is scoped to the stuck Flow Balance 1.2 deployment.
# The existing Pages publish source (main) stays unchanged.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chroma-pages-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  release-stale-pages-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Release stalled Flow Balance 1.2 Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Pages deployment ID is the commit SHA of its blocked run.
          # If it has already resolved, do not cancel a newer deployment.
          if gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/9deb606fb4e0f24238e597a0832f317ab8dc4220/cancel"; then
            echo "Stalled Flow Balance 1.2 Pages deployment cancelled; publishing may resume."
          else
            echo "::warning::The old deployment could not be cancelled (possibly already finished)."
          fi
