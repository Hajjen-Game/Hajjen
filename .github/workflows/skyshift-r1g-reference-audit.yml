name: SKYSHIFT R1G migration candidate
on:
  push:
    branches:
      - 'skyshift/root-consolidation-r1g-reference-audit'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify complete candidate from pinned R1F main
        run: |
          cp skyshift/tests/architecture/r1g-build-migration.mjs "$RUNNER_TEMP/r1g-build-migration.mjs"
          git switch --detach ab926746c1a356d8f2a9c079968e7e65dc804901
          node "$RUNNER_TEMP/r1g-build-migration.mjs"
          git diff --stat
          git fetch origin refs/heads/skyshift/root-consolidation-r1g-game-snapshots
          test "$(git rev-parse FETCH_HEAD)" = "e446ab112ae3820874f5daf9de66f6a41dacece1"
          git reset --mixed e446ab112ae3820874f5daf9de66f6a41dacece1
          git diff --exit-code -- .github/workflows
          git add -A skyshift
          git diff --cached --exit-code -- .github/workflows
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'SKYSHIFT R1G: migrate 42 audited historical game snapshots and preserve prior SHA guards'
          git push origin HEAD:refs/heads/skyshift/root-consolidation-r1g-game-snapshots
