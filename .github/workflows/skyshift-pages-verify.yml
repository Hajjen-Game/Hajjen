name: SKYSHIFT Pages publication guard
# A passing GitHub source-code test is NOT proof that GitHub Pages is current.
# Check the public HTML + loaded game module and repair a stale branch build.
on:
  push:
    branches: [main]
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-pages-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  published-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current version on the live Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -Eo 'game-v[0-9]+\.mjs' skyshift/index.html | tail -1)"
          if [[ -z "$expected" ]]; then
            echo "::error::Could not find the current game module in skyshift/index.html"
            exit 1
          fi
          echo "Local GitHub main version: $expected ($GITHUB_SHA)"
          base="https://hajjen-game.github.io/Hajjen/skyshift"
          page_info="$(gh api "repos/$GITHUB_REPOSITORY/pages")"
          printf '%s\n' "$page_info" | jq '{status, build_type, source}'
          source_branch="$(printf '%s' "$page_info" | jq -r '.source.branch // empty')"
          if [[ "$source_branch" != "main" ]]; then
            echo "::error::Pages source is not main; inspect GitHub Pages settings."
            exit 1
          fi
          verify_live() {
            local html module
            html="$(curl -fsSL --retry 2 --max-time 20 -H 'Cache-Control: no-cache' \
              "$base/index.html?release=${GITHUB_SHA:0:12}-$(date +%s)" || true)"
            if [[ "$html" != *"$expected"* ]]; then
              echo "Current public index serves: $(printf '%s' "$html" | grep -Eo 'game-v[0-9]+\.mjs' | tail -1 || true)"
              return 1
            fi
            module="$(curl -fsSL --retry 2 --max-time 20 -H 'Cache-Control: no-cache' \
              "$base/$expected?release=${GITHUB_SHA:0:12}" || true)"
            if [[ "$module" != *'game:"SKYSHIFT"'* ]]; then
              echo "Public index points to $expected, but the actual module is unavailable or invalid."
              return 1
            fi
            echo "LIVE VERIFIED: index and game module both serve $expected"
            return 0
          }
          if verify_live; then exit 0; fi
          # Allow regular Pages deployment to finish, avoiding concurrent
          # duplicate builds that could cancel an already active deployment.
          for attempt in 1 2 3 4; do
            echo "Waiting for standard Pages publication, attempt $attempt/4..."
            sleep 12
            if verify_live; then exit 0; fi
          done
          echo "::warning::Pages is still stale; requesting explicit main-branch rebuild."
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" \
            --jq '{status, error, url}'
          echo "An explicit build was requested; final verification follows."
          sleep 16
          if verify_live; then exit 0; fi
          echo "::warning::Rebuild accepted, but public site has not propagated yet. Check Pages deployment status."
