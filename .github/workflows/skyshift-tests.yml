name: SKYSHIFT track logic checks
on:
  push:
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-tests.yml'
  pull_request:
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-tests.yml'
jobs:
  track-tests:
    runs-on: ubuntu-latest
    steps:
