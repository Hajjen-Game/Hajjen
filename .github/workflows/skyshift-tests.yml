  browser-smoke:
    name: No-Jump GRIP Fix & Track Parity 0.16.5 WebGL
    needs: track-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Export SKYSHIFT 0.13.5 deterministic handling fairness report
        run: node skyshift/handling-fairness-cli-v0135.mjs
