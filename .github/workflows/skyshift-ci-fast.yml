name: SKYSHIFT fast PR checks
# SKYSHIFT CI Optimization 1.0
# A PR commit runs once (not also on branch push). Superseded commits are
# cancelled before they consume more CI minutes. Full historical visual QA is
# retained in skyshift-tests.yml and can be dispatched before any release.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-ci-fast.yml'
      - '.github/workflows/skyshift-tests.yml'

concurrency:
  group: skyshift-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-core:
    name: SKYSHIFT fast syntax, flight, solar seal & current metal unit gates
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and high-value flight/visual regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check skyshift/game-v0210.mjs
          node --check skyshift/boot-v0210.js
          node --check skyshift/dual-tone-lighting-v0260.mjs
          node --check skyshift/browser-dual-tone-lighting-v0260.mjs
          node --check skyshift/unified-tunnel-lighting-v1.mjs
          node --check skyshift/browser-unified-tunnel-lighting-v1.mjs
          node --check skyshift/cinematic-road-rebuild-v0263.mjs
          node --check skyshift/edge-lighting-floor-pools-v02631.mjs
          node --check skyshift/edge-source-floor-bands-v02632.mjs
          node --check skyshift/straight-only-edge-lighting-v02633.mjs
          node --check skyshift/final-cohesion-v0264.mjs
          node --check skyshift/unified-metal-light-response-v02641.mjs
          node --check skyshift/reflection-cohesion-v02642.mjs
          node --check skyshift/unified-fixture-transport-v02643.mjs
          node --check skyshift/true-rail-wall-response-v0265.mjs
          node --check skyshift/browser-rail-wall-v0265.mjs
          node --check skyshift/full-tunnel-layout-v0270.mjs
          node --check skyshift/full-tunnel-circuit-v0270.mjs
          node --check skyshift/full-tunnel-light-seal-v0270.mjs
          node --check skyshift/browser-full-tunnel-v0270.mjs
          node --check skyshift/vault-material-parity-v0271.mjs
          node --check skyshift/browser-vault-material-v0271.mjs
          node --check skyshift/vault-architectural-parity-v0272.mjs
          node --check skyshift/browser-vault-architecture-v0272.mjs
          node --check skyshift/vault-full-lighting-v0273.mjs
          node --check skyshift/browser-vault-lighting-v0273.mjs
          node --check skyshift/vault-premium-finish-v0274.mjs
          node --check skyshift/browser-vault-premium-finish-v0274.mjs
          node --check skyshift/shared-tunnel-architecture-v0280.mjs
          node --check skyshift/shared-tunnel-runtime-v0280.mjs
          node --check skyshift/browser-shared-tunnel-v0280.mjs
          node --check skyshift/true-shared-tunnel-renderer-v0281.mjs
          node --check skyshift/ceiling-fixture-cohesion-v02892.mjs
          node --check skyshift/premium-arch-optics-v02893.mjs
          node --check skyshift/unified-tunnel-light-sources-v02894.mjs
          node --check skyshift/road-spill-wave-coves-v02895.mjs
          node --check skyshift/curve-surface-continuity-v02896.mjs
          node --check skyshift/browser-curve-surface-continuity-v02896.mjs
          node --check skyshift/browser-road-spill-wave-cove-v02895.mjs
          node --check skyshift/browser-unified-tunnel-light-v02894.mjs
          node --check skyshift/browser-premium-arch-optics-v02893.mjs
          node --check skyshift/browser-ceiling-fixture-v02892.mjs
          node --check skyshift/browser-true-shared-tunnel-v0281.mjs
          node --check skyshift/shared-road-ship-light-v0282.mjs
          node --check skyshift/browser-shared-road-ship-v0282.mjs
          node --check skyshift/vault-boost-clarity-v0283.mjs
