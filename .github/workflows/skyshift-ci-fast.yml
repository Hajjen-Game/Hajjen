            skyshift/tests/unit/dark-metallic-foundation-v0250.test.mjs \
            skyshift/tests/unit/micro-surface-metal-definition-v0251.test.mjs \
            skyshift/tests/unit/dual-tone-lighting-v0260.test.mjs \
            skyshift/tests/unit/unified-tunnel-lighting-v1.test.mjs
          if [[ -f skyshift/tests/unit/true-metal-materials-v0260p2.test.mjs ]]; then
            node --test skyshift/tests/unit/true-metal-materials-v0260p2.test.mjs
            node --test skyshift/tests/unit/local-reflections-v0261p1.test.mjs
