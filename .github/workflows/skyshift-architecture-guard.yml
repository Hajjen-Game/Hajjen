name: SKYSHIFT architecture safety guard
# Independent, no-runtime-change guard for safe repository consolidation.
on:
  pull_request:
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-architecture-guard.yml'
      - '.github/workflows/skyshift-ci-fast.yml'
      - '.github/workflows/skyshift-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-entrypoint-graph:
    name: Validate live SKYSHIFT HTML and reachable module paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned legacy rollback commit
        run: git fetch --no-tags --depth=1 origin 06754fc69e87b23e63b73e1552f99883fadc3897
      - name: Check active bootstrap and relative imports
        run: | 
          node --test skyshift/tests/architecture/active-entrypoint.test.mjs
          node --test skyshift/tests/architecture/release-archive-integrity.test.mjs
      - name: Run relocated early flight/fullscreen unit tests
        run: node --test skyshift/tests/unit/fullscreen-v02.test.mjs skyshift/tests/unit/trial-v02.test.mjs skyshift/tests/unit/trial-v03.test.mjs
      - name: Prove migrated unit-test assertions are byte-identical
        run: node --test skyshift/tests/architecture/unit-migration-integrity.test.mjs
      - name: Run all 10 newly relocated unit tests
        run: |
          node --test skyshift/tests/unit/performance-audit-v0110.test.mjs skyshift/tests/unit/render-optimizer-v0111.test.mjs skyshift/tests/unit/cinematic-space-lighting-v0170.test.mjs skyshift/tests/unit/ship-hero-loader-v0133.test.mjs skyshift/tests/unit/ship-hero-loader-v0134.test.mjs skyshift/tests/unit/ship-hero-loader-v01342.test.mjs skyshift/tests/unit/unified-flight-v0112.test.mjs skyshift/tests/unit/visual-fidelity-v0113.test.mjs skyshift/tests/unit/visual-fidelity-v0114.test.mjs skyshift/tests/unit/track.test.mjs
      - name: Verify 60 byte-identical migrated test assertions and no stale paths
        run: node --test skyshift/tests/architecture/bulk-unit-migration-integrity.test.mjs
      - name: Audit 125 safely relocated stage-7 unit tests and workflow paths
        run: node --test skyshift/tests/architecture/stage7-unit-migration-integrity.test.mjs
      - name: Audit final 12 formerly protected tests, historical source parity and subprocess probes
        run: node --test skyshift/tests/architecture/stage8-unit-migration-integrity.test.mjs
      - name: Validate CI 2.0 change classifier and fail-safe cases
        run: node --test skyshift/tests/architecture/ci-change-scope-v2.test.mjs
      - name: Audit 42 byte-identical browser QA runners and updated workflow paths
        run: node --test skyshift/tests/architecture/browser-harness-relocation-stageB.test.mjs
      - name: Audit Stage C relocated live rendering modules, original SHA and import consumers
        run: node --test skyshift/tests/architecture/rendering-migration-stageC.test.mjs
      - name: Audit Stage D tunnel optics original SHA and all resolved module imports
        run: node --test skyshift/tests/architecture/tunnel-migration-stageD.test.mjs
      - name: Audit Stage E original Vault Git blobs and all new module/CI paths
        run: node --test skyshift/tests/architecture/vault-migration-stageE.test.mjs
      - name: Audit Stage F original shared-track/Skyline Git blobs and historical paths
        run: node --test skyshift/tests/architecture/track-migration-stageF.test.mjs
      - name: Audit Stage G original ship/fleet source SHAs and relocated CI paths
        run: node --test skyshift/tests/architecture/ship-migration-stageG.test.mjs
      - name: Audit Stage H immutable flight source SHAs and relocated consumers
        run: node --test skyshift/tests/architecture/flight-migration-stageH.test.mjs
      - name: Audit Stage I immutable performance/fidelity Git blobs and migrated import paths
        run: node --test skyshift/tests/architecture/core-migration-stageI.test.mjs
      - name: Audit Stage J immutable barrier/boost source SHA and all consumer paths
        run: node --test skyshift/tests/architecture/barrier-boost-migration-stageJ.test.mjs
      - name: Stage K audit 57 byte-identical historical WebGL smoke runners and CI paths
        run: |
          node --test skyshift/tests/architecture/legacy-browser-migration-stageK.test.mjs
          for file in skyshift/tests/browser/legacy/browser-smoke-v*.mjs; do node --check "$file"; done
      - name: Stage L audit 45 original browser QA Git blobs and all migrated CI paths
        run: |
          node --test skyshift/tests/architecture/browser-qa-migration-stageL.test.mjs
          for file in skyshift/tests/browser/browser-*.mjs; do node --check "$file"; done
      - name: Stage M audit 16 immutable world modules, glTF URL parity and historical references
        run: node --test skyshift/tests/architecture/station-world-migration-stageM.test.mjs
      - name: R1 audit 19 original boot Git blob SHAs and runtime game URLs
        run: node --test skyshift/tests/architecture/legacy-boot-migration-r1.test.mjs
      - name: R1B audit 20 original boot Git blobs, 22 historical test readers and root-count invariant
        run: node --test skyshift/tests/architecture/legacy-boot-migration-r1b.test.mjs
      - name: R1C preserve 20 historical boots and 24 original unit-test Git hashes
        run: node --test skyshift/tests/architecture/legacy-boot-migration-r1c.test.mjs
      - name: R1D preserve 22 historic bootstrap Git blobs, 34 unit readers and 387 root files
        run: node --test skyshift/tests/architecture/legacy-boot-migration-r1d.test.mjs
      - name: R1E preserve 30 original game Git blobs, 28 historical unit readers, 8 boot URL targets and 357 root files
        run: node --test skyshift/tests/architecture/legacy-game-migration-r1e.test.mjs
      - name: R1F preserve 29 original game Git blobs, 25 historical reader SHA hashes, 29 archived boots and 328 root files
        run: node --test skyshift/tests/architecture/legacy-game-migration-r1f.test.mjs
      - name: R1G preserve 42 original game Git blobs and 286 root files
        run: node --test skyshift/tests/architecture/legacy-game-migration-r1g.test.mjs
      - name: Verify retired snapshots and no executable references
        run: node --test skyshift/tests/architecture/legacy-retirement-l1a.test.mjs
      - name: Verify L1B retired fixtures and exact source reader identity
        run: node --test skyshift/tests/architecture/legacy-retirement-l1b.test.mjs
      - name: Verify L1C retired fixtures and exact source reader identity
        run: node --test skyshift/tests/architecture/legacy-retirement-l1c.test.mjs
      - name: Verify L1D retired fixtures and exact source reader identity
        run: node --test skyshift/tests/architecture/legacy-retirement-l1d.test.mjs
      - name: Verify L1E retired fixtures and exact source reader identity
        run: node --test skyshift/tests/architecture/legacy-retirement-l1e.test.mjs
      - name: Run exact post-merge track logic unit suite before merge
        run: node --test skyshift/tests/unit/environment-art-pipeline-v0205.test.mjs skyshift/tests/unit/environment-art-pipeline-v02041.test.mjs skyshift/tests/unit/environment-art-pipeline-v0204.test.mjs skyshift/tests/unit/environment-art-pipeline-v0203.test.mjs skyshift/tests/unit/environment-art-pipeline-v02021.test.mjs skyshift/tests/unit/environment-art-pipeline-v0202.test.mjs skyshift/tests/unit/environment-art-pipeline-v0201.test.mjs skyshift/tests/unit/environment-art-pipeline-v0200.test.mjs skyshift/tests/unit/orbital-hero-v0192.test.mjs skyshift/tests/unit/world-rebuild-v0190.test.mjs skyshift/tests/unit/signature-environment-v0180.test.mjs skyshift/tests/unit/cinematic-space-lighting-v0170.test.mjs skyshift/tests/unit/track.test.mjs skyshift/tests/unit/trial-v02.test.mjs skyshift/tests/unit/handling-fairness-v0135.test.mjs skyshift/tests/unit/track-integrity-v0165.test.mjs skyshift/tests/unit/track-physics-parity-v0165.test.mjs skyshift/tests/unit/grip-trick-lock-v0165.test.mjs skyshift/tests/unit/ship-hero-loader-v01342.test.mjs skyshift/tests/unit/ship-hero-loader-v0134.test.mjs skyshift/tests/unit/ship-art-pipeline-v0132.test.mjs skyshift/tests/unit/stingray-hero-preview-v01321.test.mjs skyshift/tests/unit/time-trial-v0130.test.mjs skyshift/tests/unit/racing-experience-v0120.test.mjs skyshift/tests/unit/racing-experience-v0121.test.mjs skyshift/tests/unit/performance-audit-v0110.test.mjs skyshift/tests/unit/render-optimizer-v0111.test.mjs skyshift/tests/unit/unified-flight-v0112.test.mjs skyshift/tests/unit/visual-fidelity-v0113.test.mjs skyshift/tests/unit/visual-fidelity-v0114.test.mjs
      - name: Syntax-check the migrated historical test collection without changing its original assertions
        run: |
          for file in skyshift/tests/unit/*.test.mjs; do node --check "$file"; done
