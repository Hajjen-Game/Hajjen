name: SKYSHIFT EF02 visual fidelity parity
on:
  pull_request:
    paths:
      - 'skyshift/core/visual-fidelity*.mjs'
      - 'skyshift/tests/architecture/ef02-fidelity-parity.mjs'
      - 'skyshift/rendering/road/premium-track-v0160.mjs'
      - 'skyshift/core/zone-wave-v060.mjs'
      - 'skyshift/tracks/shared/smooth-track-v0160.mjs'
      - 'skyshift/tracks/trials/trial-v0160.mjs'
      - 'skyshift/flight/boost/boost-v0160.mjs'
      - 'skyshift/flight/boost/risk-reward-v0160.mjs'
      - 'skyshift/tunnel/vault-spatial-wave-parity-v0285.mjs'
      - 'skyshift/tests/architecture/ef02-premium-track-parity.mjs'
      - '.github/workflows/skyshift-ef02-fidelity-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fidelity-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare exact shader outputs and uniforms to EF01
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4983f20f6cf867f91e1ebd57ad48b1d0c685997c
          git worktree add --detach "$RUNNER_TEMP/ef02-reference" 4983f20f6cf867f91e1ebd57ad48b1d0c685997c
          for track in skyline vault aurora; do
            node skyshift/tests/architecture/ef02-fidelity-parity.mjs "$RUNNER_TEMP/ef02-reference" "$track"
            node skyshift/tests/architecture/ef02-premium-track-parity.mjs "$RUNNER_TEMP/ef02-reference" "$track"
          done
