name: Build Tiby PvP 2.5D character

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-tiby-pvp25d.yml"
      - "pvp-25d/tools/tiby/**"

permissions:
  contents: write

concurrency:
  group: build-tiby-pvp25d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip curl python3-numpy

      - name: Download CC0 Tiby source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/tiby-source
          curl -L --fail --retry 3 \
            "https://opengameart.org/sites/default/files/Tiby_Character_MnF_0.zip" \
            -o /tmp/Tiby_Character_MnF_0.zip
          echo "2c438d05446eedff5e59c879d93922c38fe0e42692e646be783eef278a2a744c  /tmp/Tiby_Character_MnF_0.zip" \
            | sha256sum -c -
          sha256sum /tmp/Tiby_Character_MnF_0.zip | tee /tmp/tiby-source-sha256.txt
          unzip -q /tmp/Tiby_Character_MnF_0.zip -d /tmp/tiby-source
          echo "Tiby source contents:"
          find /tmp/tiby-source -maxdepth 3 -type f -printf "%p\n" | sort

      - name: Choose neutral Blender source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t blends < <(find /tmp/tiby-source -type f -iname "*.blend" | sort)
          if [ "${#blends[@]}" -eq 0 ]; then
            echo "No .blend source found" >&2
            exit 1
          fi

          # Prefer a non-female, non-long-hair source when filenames expose it.
          selected=""
          for file in "${blends[@]}"; do
            lower="$(echo "$file" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower" != *female* && "$lower" != *girl* && "$lower" != *long* ]]; then
              selected="$file"
              break
            fi
          done
          if [ -z "$selected" ]; then
            selected="${blends[0]}"
          fi

          echo "Using source: $selected"
          echo "path=$selected" >> "$GITHUB_OUTPUT"

      - name: Export Babylon GLB
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p pvp-25d/assets/characters/tiby
          blender -b "${{ steps.source.outputs.path }}" \
            --python pvp-25d/tools/tiby/export_tiby.py \
            -- "$PWD/pvp-25d/assets/characters/tiby/tiby-base.glb"
          test -s pvp-25d/assets/characters/tiby/tiby-base.glb
          cp /tmp/tiby-source-sha256.txt \
            pvp-25d/assets/characters/tiby/SOURCE_SHA256.txt
          ls -lh pvp-25d/assets/characters/tiby/

      - name: Commit generated GLB
        shell: bash
        run: |
          set -euo pipefail
          git add \
            pvp-25d/assets/characters/tiby/tiby-base.glb \
            pvp-25d/assets/characters/tiby/SOURCE_SHA256.txt

          if git diff --cached --quiet; then
            echo "Generated Tiby files are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Tiby GLB for PvP 2.5D"
          git push
