name: Build Quaternius PvP 2.5D characters

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-quaternius-pvp25d.yml"
      - "pvp-25d/tools/quaternius/**"

permissions:
  contents: write

concurrency:
  group: build-quaternius-pvp25d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender git python3-numpy

      - name: Fetch Quaternius CC0 outfit sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/agentkaerf/FreeModels.git \
            /tmp/quaternius-src
          git -C /tmp/quaternius-src sparse-checkout set --skip-checks \
            "Modular Character Outfits - Fantasy[Standard]/Exports/glTF (Godot-Unreal)/Outfits"

      - name: Export Quaternius PvP 2.5D variants
        shell: bash
        run: |
          set -euxo pipefail
          base="/tmp/quaternius-src/Modular Character Outfits - Fantasy[Standard]/Exports/glTF (Godot-Unreal)/Outfits"
          out="$PWD/pvp-25d/assets/characters/quaternius"
          mkdir -p "$out"

          blender -b --python pvp-25d/tools/quaternius/build_quaternius.py -- \
            caster "$base/Male_Peasant.gltf" "$out/quaternius-caster.glb"
          blender -b --python pvp-25d/tools/quaternius/build_quaternius.py -- \
            rogue "$base/Male_Ranger.gltf" "$out/quaternius-rogue.glb"
          blender -b --python pvp-25d/tools/quaternius/build_quaternius.py -- \
            warrior "$base/Male_Ranger.gltf" "$out/quaternius-warrior.glb"

          test -s "$out/quaternius-caster.glb"
          test -s "$out/quaternius-rogue.glb"
          test -s "$out/quaternius-warrior.glb"
          ls -lh "$out"

      - name: Commit generated Quaternius GLBs
        shell: bash
        run: |
          set -euo pipefail
          git add pvp-25d/assets/characters/quaternius/*.glb
          if git diff --cached --quiet; then
            echo "Generated Quaternius files are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Quaternius GLBs for PvP 2.5D"
          git push
