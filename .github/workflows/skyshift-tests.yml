name: SKYSHIFT track logic checks
on:
  push:
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-tests.yml'
  pull_request:
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-tests.yml'
jobs:
  track-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: |
          node --check skyshift/game.mjs
          node --check skyshift/track.mjs
          node --check skyshift/game-v02.mjs
          node --check skyshift/trial-v02.mjs
      - name: Verify SKYSHIFT deterministic track planner
        run: node --test skyshift/track.test.mjs skyshift/trial-v02.test.mjs
