name: SKYSHIFT EF01 feature and lifecycle baseline
on:
  pull_request:
    paths:
      - 'skyshift/tests/architecture/ef01-feature-probe.mjs'
      - 'skyshift/tests/architecture/ef01-source-review.mjs'
      - 'skyshift/tests/browser/ef01-lifecycle.mjs'
      - '.github/workflows/skyshift-ef01-feature-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  BASELINE: 4983f20f6cf867f91e1ebd57ad48b1d0c685997c
jobs:
  features-and-references:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin and audit current reusable flight modules and live source
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/ef01-source" "$BASELINE"
          mkdir -p "$RUNNER_TEMP/ef01"
          node skyshift/tests/architecture/ef01-census.mjs "$RUNNER_TEMP/ef01-source" "$RUNNER_TEMP/ef01/census.json" "$BASELINE"
          node skyshift/tests/architecture/ef01-source-review.mjs "$RUNNER_TEMP/ef01-source" "$RUNNER_TEMP/ef01/census.json" "$RUNNER_TEMP/ef01/source-review.json"
          for track in skyline vault aurora; do
            node skyshift/tests/architecture/ef01-feature-probe.mjs "$RUNNER_TEMP/ef01-source" "$track" | tee "$RUNNER_TEMP/ef01/feature-$track.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyshift-ef01-feature-and-source-review
          path: ${{ runner.temp }}/ef01/
          if-no-files-found: error
  vault-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing Vault build with external shader and restart instrumentation
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          git fetch --no-tags --depth=1 origin "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/ef01-source" "$BASELINE"
          node skyshift/tests/browser/ef01-lifecycle.mjs "$RUNNER_TEMP/ef01-source" "$RUNNER_TEMP/ef01-lifecycle"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyshift-ef01-vault-lifecycle
          path: ${{ runner.temp }}/ef01-lifecycle/
          if-no-files-found: error
