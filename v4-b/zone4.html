  <script>
    (()=>{
      const url=new URL(location.href);
      if(url.searchParams.get('dev')==='1'){
        window.HAJJEN_ZONE4_DEV_REQUESTED=true;
        url.searchParams.delete('dev');
        history.replaceState(history.state,'',`${url.pathname}${url.search}${url.hash}`);
      }
    })();
  </script>

  <!-- Reuse the proven production Potion UI without changing Zones 1–3.
       The Potion module only needs the historical Zone 3 craft bridge; Zone 4
       supplies that hidden bridge in zone4-potion-compat-1.0.js. -->
  <script>
    window.__HAJJEN_ZONE4_REAL_ZONE=window.HAJJEN_ZONE_CONFIG.zone;
    window.HAJJEN_ZONE_CONFIG.zone=3;
  </script>
  <script src="shared-hajjen-spellbook-production-potion-1.0.js?v=zone4-1"></script>
  <script>
    window.HAJJEN_ZONE_CONFIG.zone=window.__HAJJEN_ZONE4_REAL_ZONE;
    delete window.__HAJJEN_ZONE4_REAL_ZONE;
  </script>

  <script src="zone4-spell-potency-1.0.js?v=2"></script>
  <script src="zone4-tactical-combat-1.0.js?v=1"></script>
  <script src="shared-hajjen-action-bar-production-1.0.js?v=2"></script>

  <!-- The approved production Hand renderer currently identifies supported
       zones as 1–3. Execute it once against the Zone 4 Hand through its stable
       Zone 3-compatible DOM contract; its closure then stays bound to this Hand. -->
  <script>
    if(window.HAJJEN_SHARED_HAND){window.__HAJJEN_ZONE4_HAND_ZONE=window.HAJJEN_SHARED_HAND.zone;window.HAJJEN_SHARED_HAND.zone=3;}
  </script>
  <script src="shared-hajjen-hand-list-production-1.0.js?v=zone4-1"></script>
  <script>
    if(window.HAJJEN_SHARED_HAND&&window.__HAJJEN_ZONE4_HAND_ZONE){window.HAJJEN_SHARED_HAND.zone=window.__HAJJEN_ZONE4_HAND_ZONE;}
    delete window.__HAJJEN_ZONE4_HAND_ZONE;
  </script>

  <script>
    (()=>{
      const html=document.documentElement;
      delete html.dataset.hajjenRedesignReady;
      document.addEventListener('hajjen-ui-redesign-promoted',()=>{html.dataset.hajjenRedesignReady='1';},{once:true});
      setTimeout(()=>{html.dataset.hajjenRedesignReady='1';},2500);
    })();
  </script>
  <script data-hajjen-redesign-production="1" src="shared-hajjen-redesign-production-1.0.js?v=9"></script>
  <script src="zone4-card-reward-test-1.0.js?v=2"></script>
  <script src="zone4-card-reward-manip-copy-fix-1.0.js?v=1"></script>
  <script src="zone4-card-reward-trigger-info-fix-1.0.js?v=1"></script>

  <script>
    (()=>{
      if(!window.HAJJEN_ZONE4_DEV_REQUESTED)return;
      const url=new URL(location.href);url.searchParams.set('dev','1');
      history.replaceState(history.state,'',`${url.pathname}${url.search}${url.hash}`);
    })();
  </script>
