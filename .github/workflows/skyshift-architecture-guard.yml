name: SKYSHIFT architecture safety guard
# Independent, no-runtime-change guard for safe repository consolidation.
on:
  pull_request:
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-architecture-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-entrypoint-graph:
    name: Validate live SKYSHIFT HTML and reachable module paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active bootstrap and relative imports
        run: | 
          node --test skyshift/tests/architecture/active-entrypoint.test.mjs
          node --test skyshift/tests/architecture/release-archive-integrity.test.mjs
      - name: Run relocated early flight/fullscreen unit tests
        run: node --test skyshift/tests/unit/fullscreen-v02.test.mjs skyshift/tests/unit/trial-v02.test.mjs skyshift/tests/unit/trial-v03.test.mjs
      - name: Prove migrated unit-test assertions are byte-identical
        run: node --test skyshift/tests/architecture/unit-migration-integrity.test.mjs
      - name: Run all 10 newly relocated unit tests
        run: |
          node --test skyshift/tests/unit/performance-audit-v0110.test.mjs skyshift/tests/unit/render-optimizer-v0111.test.mjs skyshift/tests/unit/cinematic-space-lighting-v0170.test.mjs skyshift/tests/unit/ship-hero-loader-v0133.test.mjs skyshift/tests/unit/ship-hero-loader-v0134.test.mjs skyshift/tests/unit/ship-hero-loader-v01342.test.mjs skyshift/tests/unit/unified-flight-v0112.test.mjs skyshift/tests/unit/visual-fidelity-v0113.test.mjs skyshift/tests/unit/visual-fidelity-v0114.test.mjs skyshift/tests/unit/track.test.mjs
      - name: Verify 60 byte-identical migrated test assertions and no stale paths
        run: node --test skyshift/tests/architecture/bulk-unit-migration-integrity.test.mjs
      - name: Run bulk migrated unit tests group 1/3
        run: node --test skyshift/tests/unit/aero-barrier-v047.test.mjs skyshift/tests/unit/air-tricks-v080.test.mjs skyshift/tests/unit/arch-foot-light-assembly-v0287.test.mjs skyshift/tests/unit/architectural-neon-lighting-v0240.test.mjs skyshift/tests/unit/boost-chase-v0494.test.mjs skyshift/tests/unit/boost-spring-v0495.test.mjs skyshift/tests/unit/boost-zone-v048.test.mjs skyshift/tests/unit/build-version-v02204.test.mjs skyshift/tests/unit/ceiling-fixture-cohesion-v02892.test.mjs skyshift/tests/unit/cinematic-energy-v0216.test.mjs skyshift/tests/unit/cinematic-grade-v0210b.test.mjs skyshift/tests/unit/cinematic-hero-v0210.test.mjs skyshift/tests/unit/cinematic-light-architecture-v0232.test.mjs skyshift/tests/unit/cinematic-metal-neon-v0289.test.mjs skyshift/tests/unit/cinematic-neon-lighting-v0220p2.test.mjs skyshift/tests/unit/cinematic-road-rebuild-v0263.test.mjs skyshift/tests/unit/cinematic-road-reflections-v0242.test.mjs skyshift/tests/unit/cinematic-v045.test.mjs skyshift/tests/unit/circuit-v060.test.mjs skyshift/tests/unit/clean-v034.test.mjs
      - name: Run bulk migrated unit tests group 2/3
        run: node --test skyshift/tests/unit/corkscrew-v072.test.mjs skyshift/tests/unit/curve-surface-continuity-v02896.test.mjs skyshift/tests/unit/dark-metallic-foundation-v0250.test.mjs skyshift/tests/unit/dual-tone-lighting-v0260.test.mjs skyshift/tests/unit/edge-lighting-floor-pools-v02631.test.mjs skyshift/tests/unit/edge-source-floor-bands-v02632.test.mjs skyshift/tests/unit/elevated-rails-v0497.test.mjs skyshift/tests/unit/environment-art-pipeline-v0200.test.mjs skyshift/tests/unit/environment-art-pipeline-v0201.test.mjs skyshift/tests/unit/environment-art-pipeline-v0202.test.mjs skyshift/tests/unit/environment-art-pipeline-v02021.test.mjs skyshift/tests/unit/environment-art-pipeline-v0203.test.mjs skyshift/tests/unit/environment-art-pipeline-v0204.test.mjs skyshift/tests/unit/environment-art-pipeline-v02041.test.mjs skyshift/tests/unit/environment-art-pipeline-v0205.test.mjs skyshift/tests/unit/extended-zone-v049.test.mjs skyshift/tests/unit/final-cohesion-v0264.test.mjs skyshift/tests/unit/fleet-v010.test.mjs skyshift/tests/unit/flight-motion-v044.test.mjs skyshift/tests/unit/flow-v04.test.mjs
      - name: Run bulk migrated unit tests group 3/3
        run: node --test skyshift/tests/unit/full-circuit-v050.test.mjs skyshift/tests/unit/full-tunnel-circuit-v0270.test.mjs skyshift/tests/unit/full-tunnel-layout-v0270.test.mjs skyshift/tests/unit/full-tunnel-light-seal-v0270.test.mjs skyshift/tests/unit/grip-first-v0901.test.mjs skyshift/tests/unit/grip-half-power-v01348.test.mjs skyshift/tests/unit/grip-leap-v081.test.mjs skyshift/tests/unit/grip-trick-lock-v0165.test.mjs skyshift/tests/unit/handling-fairness-v0135.test.mjs skyshift/tests/unit/handling-parity-v01347.test.mjs skyshift/tests/unit/handling-v042.test.mjs skyshift/tests/unit/hard-edge-v0484.test.mjs skyshift/tests/unit/identity-v033.test.mjs skyshift/tests/unit/image-clarity-v0498.test.mjs skyshift/tests/unit/integrated-neon-flow-v0214.test.mjs skyshift/tests/unit/kinetic-camera-v090.test.mjs skyshift/tests/unit/living-wake-v0107.test.mjs skyshift/tests/unit/living-wake-v01071.test.mjs skyshift/tests/unit/local-reflections-v0261p1.test.mjs skyshift/tests/unit/luminance-v0331.test.mjs
