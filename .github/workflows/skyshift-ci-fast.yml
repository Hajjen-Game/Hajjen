          node --check skyshift/vault-spatial-wave-parity-v0285.mjs
          node --check skyshift/browser-vault-spatial-wave-v0285.mjs
          node --check skyshift/reflection-stability-strips-v0286.mjs
          node --check skyshift/browser-reflection-stability-v0286.mjs
          node --check skyshift/arch-foot-light-assembly-v0287.mjs
          node --check skyshift/browser-arch-foot-light-assembly-v0287.mjs
          node --check skyshift/browser-fixture-transport-v02643.mjs
          node --check skyshift/browser-reflection-cohesion-v02642.mjs
          node --check skyshift/browser-unified-metal-v02641.mjs
