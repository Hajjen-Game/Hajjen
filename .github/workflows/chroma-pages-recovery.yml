name: CHROMA RUSH Pages recovery

# One-time recovery for a stale Pages deployment lock.
# Only changing this workflow triggers this job; it does not affect any game files.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chroma-pages-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  release-stale-pages-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel blocked Pages deployment 67aa70c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/67aa70ceefdc54a68723369a857555201e6e9b49/cancel"
          echo "GitHub Pages stale deployment cancellation requested."
