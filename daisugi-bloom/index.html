<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="theme-color" content="#f4e5d0">
 <meta name="description" content="Japanese Harmony — fuse Japanese treasures, clear the Mist, and create Harmony Pulse chains.">
 <link rel="icon" href="./favicon.svg" type="image/svg+xml">
 <title>Japanese Harmony · Washi Zen 1.1</title>
 <link rel="stylesheet" href="./harmony/styles.css?v=6.24.0-core-clarity">
 <link rel="stylesheet" href="./harmony/mobile-game.css?v=6.51.0-en">
 <link rel="stylesheet" href="./harmony/washi-zen.css?v=1.6.0-background-v2">
 <link rel="stylesheet" href="./harmony/gameplay-washi.css?v=6.51.0-en">
 <link rel="stylesheet" href="./harmony/washi-dialogs.css?v=1.0.0-washi-zen">
 <link rel="stylesheet" href="./harmony/gameplay-washi-panel-art.css?v=3.5.0-score-left-moves-right">
 <link rel="stylesheet" href="./harmony/english-visual-hierarchy.css?v=1.0.0-en-ja">
 <link rel="stylesheet" href="./harmony/onboarding.css?v=2.2.0-frame-inset">
 <link rel="stylesheet" href="./harmony/omamori-audit.css?v=5.0.0">
 <link rel="stylesheet" href="./harmony/chapter-identity.css?v=2.0.0">
 <script defer src="./harmony/approved-game-panels.js?v=2.9.0-exact-user-hud"></script>
 <script defer src="./harmony/rules.js?v=6.54.1-chapter2"></script>
 <script defer src="./harmony/onboarding.js?v=2.1.0-lantern"></script>
 <script defer src="./harmony/performance.js?v=5.6.0"></script>
 <script defer src="./harmony/audio.js?v=5.6.0"></script>
 <script defer src="./harmony/diagnostics.js?v=6.51.0-en"></script>
 <script defer src="./harmony/goshuincho.js?v=6.54.0-chapter2"></script>
 <script defer src="./harmony/economy.js?v=6.53.0-omamori5"></script>
  <script defer src="./harmony/spirits.js?v=6.51.0-en"></script>
  <script defer src="./harmony/powers.js?v=6.51.0-en"></script>
  <script defer src="./harmony/cards.js?v=6.53.0-omamori5"></script>
 <script defer src="./harmony/fortune.js?v=6.51.0-en"></script>
 <script defer src="./harmony/app.js?v=6.54.2-compact-book"></script>
</head>
<body>
 <img id="festivalBackdrop" class="festival-backdrop"
      src="./assets/backgrounds/festival-hd-1.avif"
      alt="" aria-hidden="true" decoding="async" fetchpriority="high">
 <div id="app">
  <header class="topbar">
   <button id="homeButton" class="brand" aria-label="Open Goshuincho level select"><span class="brand-flower">✿</span><span>JAPANESE <strong>HARMONY</strong></span></button>
   <div class="top-actions"><button id="settingsButton" class="icon-button" aria-label="Settings">⚙</button></div>
  </header>
  <main>
   <section id="menuView" class="menu-view washi-home" aria-label="Japanese Harmony home screen">
    <div class="washi-home-logo" role="img" aria-label="Japanese Harmony">
      <img class="washi-home-asset-logo" src="./assets/washi-zen/logo.webp" alt="" decoding="async">
      <span class="washi-home-kanji" lang="ja">和</span><span class="washi-home-seal" lang="ja">日本</span>
      <span class="washi-home-name">JAPANESE <small>HARMONY</small></span>
      <span class="washi-home-rule" aria-hidden="true">──── ✿ ────</span>
    </div>
    <div class="washi-home-controls">
      <button type="button" id="continueButton" class="washi-play-main"><span lang="ja">プレイ</span><strong>PLAY</strong></button>
      <div class="washi-home-links" aria-label="Collection and rewards">
        <button type="button" id="goshuinButton" class="washi-home-link">
          <span class="washi-link-illustration" aria-hidden="true">▤</span><span lang="ja">御朱印帳</span><strong>GOSHUINCHO</strong><small id="goshuinProgress">0 stamps</small>
        </button>
        <button type="button" id="omamoriButton" class="washi-home-link">
          <span class="washi-link-illustration" aria-hidden="true">守</span><span lang="ja">お守り</span><strong>OMAMORI</strong><small id="omamoriProgress">Cards</small><span id="harmonyCoins" class="washi-wallet">0 coins</span>
        </button>
        <button type="button" id="omikujiButton" class="washi-home-link">
          <span class="washi-link-illustration" aria-hidden="true">⛩</span><span lang="ja">おみくじ</span><strong>OMIKUJI</strong><small id="omikujiStatus">Fortune</small>
        </button>
      </div>
      <details class="washi-advanced" id="menuAdvanced">
        <summary>Game Settings</summary>
        <label for="gameDirectorMode">GAME ENGINE</label>
        <select id="gameDirectorMode" aria-label="Choose Director mode for new games">
          <option value="auto" selected>Automatic · 4.0 from level 10</option>
          <option value="v4">Harmony Director 4.0 · test</option>
          <option value="v3">Harmony Pacing Director 3.0</option>
          <option value="v31">Objective Awareness Director 3.1</option>
          <option value="v311">Endgame Objective Awareness 3.1.1</option>
          <option value="v2">Opportunity Director 2.0</option>
          <option value="standard">Standard</option>
        </select>
        <p id="directorModeDescription">3.0 on levels 1–9 and 4.0 from level 10.</p>
        <div class="washi-advanced-actions"><button id="helpButton" type="button">How to Play</button><button id="devButton" type="button" aria-label="Game Dev Motorlab">Game Dev · Motorlab</button></div>
      </details>
    </div>
    <div id="levelList" class="level-list" hidden inert aria-hidden="true"></div>
    <nav id="levelPager" class="level-pager" hidden inert aria-hidden="true"></nav>
  </section>
  <section id="gameView" class="game-view" hidden>
    <div class="game-heading" aria-label="Game status">
     <div id="scorePanel" class="hud-score score-panel">
      <span class="hud-label">BONUS SCORE <span class="jh-jp" lang="ja">得点</span></span>
      <strong id="scoreCount">0</strong>
      <div class="hud-score-footer"><span id="statusStars" class="star-mini" aria-label="Level star rating"></span></div>
      <strong id="scoreBest" hidden aria-hidden="true">0</strong>
     </div>
     <div class="moves"><span>MOVES LEFT <span class="jh-jp" lang="ja">手数</span></span><strong id="movesCount">24</strong></div>
     <button id="pauseButton" class="pause-button" aria-label="Open game menu" title="Game menu">Ⅱ</button>
    </div>
    <div id="paceStatus" class="pace-status" aria-live="off">PACING 3.0 · BUILD</div>
    <div class="game-meta"><span class="eyebrow" id="levelNumber">LEVEL 1 OF 10</span><strong id="levelTitle">First Match</strong></div>
     <div id="spiritBadge" class="spirit-badge" hidden aria-live="polite"></div>
    <div class="goal"><span class="goal-glyph" aria-hidden="true">✿</span><span id="goalLabel">Fusions</span><button type="button" id="goalHelpButton" class="jh-goal-help" aria-label="Explain this level goal" title="How this level works">?</button><strong id="goalProgress">0 / 5</strong></div>
    <div id="starTargets" class="star-targets" aria-label="Historical star thresholds for saved older levels" hidden>
     <span></span><span></span><span></span>
    </div>
     <div class="board-shell">
     <div class="board-frame-art" aria-hidden="true"></div>
     <div id="board" class="board" role="grid" aria-label="7 by 7 board of Japanese treasures"></div>
     <div id="resonanceLinks" class="resonance-links" aria-hidden="true"></div>
     <div id="boardPraise" class="board-praise" aria-hidden="true"></div>
    </div>
    <div id="omamoriPowerBar" class="omamori-power-bar" hidden aria-label="Omamori powers"></div>
    <!-- Data-only masterpiece bookkeeping: no visible collection panel in gameplay. -->
    <div id="masterpieceCollection" hidden aria-hidden="true"></div>
    <p id="selectedInfo" class="sr-only" role="status" aria-live="polite">Swap adjacent tiles or swipe.</p>
   </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal" class="modal" hidden>
   <section class="modal-inner" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
     <div class="eyebrow" id="modalEyebrow">HARMONY</div><h2 id="modalTitle"></h2>
     <div id="modalContent"></div>
     <div id="modalActions" class="modal-actions"></div>
   </section>
  </div>
 </div>
</body>
</html>
