# One-off maintenance, branch-only. Never touches app code or live content.
name: Repair stale Pages deployment 2026-11-01
on:
  push:
    branches:
      - maintenance/unstick-pages-20261101
permissions:
  contents: read
  deployments: write
  pages: write
jobs:
  release-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the specific stale GitHub Pages deployment SHA
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const staleSha="094aa5e387aaf2c26a937b34b6bbe44779ddc930";
            const endpoint="GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}";
            try{
              const current=await github.request(endpoint,{
                owner,repo,pages_deployment_id:staleSha
              });
              core.info("Old Pages deployment status before fix: "+JSON.stringify(current.data));
            }catch(err){
              core.warning("Pages status read: "+err.status+" "+err.message);
            }
            const result=await github.request(
              "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
              {owner,repo,pages_deployment_id:staleSha}
            );
            core.info("Cancellation of old Pages deployment returned HTTP "+result.status);
      - name: Diagnose and release only the stale successful-commit Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const staleSha="094aa5e387aaf2c26a937b34b6bbe44779ddc930";
            const deploys=await github.paginate(github.rest.repos.listDeployments,{
              owner,repo,sha:staleSha,environment:"github-pages",per_page:100
            });
            core.info("Pages deployment records for older SHA: "+deploys.length);
            let released=0;
            for(const dep of deploys){
              const {data:statuses}=await github.rest.repos.listDeploymentStatuses({
                owner,repo,deployment_id:dep.id,per_page:100
              });
              const latest=statuses[0];
              core.info("Deployment "+dep.id+" status="+(latest?.state||"none")+
                " created="+dep.created_at);
              if(!latest||!["in_progress","queued","pending"].includes(latest.state))
                continue;
              if(Date.now()-Date.parse(latest.created_at)<10*60*1000){
                core.warning("Not touching an active deployment less than 10 min old");
                continue;
              }
              await github.rest.repos.createDeploymentStatus({
                owner,repo,deployment_id:dep.id,state:"failure",
                description:"Release stale Pages deployment blocking Hanabi 1.0 publication",
                auto_inactive:false
              });
              released++;core.info("Released stale Pages deployment "+dep.id);
            }
            core.info("Stale deployment statuses released: "+released);
            // Read-only Pages backend diagnostics. Never modify a
            // successfully published website based on a stale UI label.
            for(const [name,endpoint] of [
              ["site","GET /repos/{owner}/{repo}/pages"],
              ["recent-builds","GET /repos/{owner}/{repo}/pages/builds"],
              ["last-build","GET /repos/{owner}/{repo}/pages/builds/latest"]
            ]){
              try{
                const result=await github.request(endpoint,{owner,repo});
                if(name==="site"){
                  const d=result.data;
                  core.info("Pages site status="+d.status+" build_type="+d.build_type+
                    " url="+d.html_url+" custom_domain="+d.cname);
                }else if(name==="recent-builds"){
                  core.info("Recent Pages builds: "+JSON.stringify(
                    result.data.slice(0,4).map(d=>({status:d.status,commit:d.commit,
                      created_at:d.created_at,updated_at:d.updated_at,error:d.error}))));
                }else{
                  const d=result.data;
                  core.info("Last Pages build: "+JSON.stringify({status:d.status,
                    commit:d.commit,created_at:d.created_at,updated_at:d.updated_at,error:d.error}));
                }
              }catch(err){core.warning("Pages "+name+" query: "+err.status+" "+err.message)}
            }

