name: SKYSHIFT one-time main QA recovery for PR 226
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.github/workflows/skyshift-main-qa-recovery-226.yml'
permissions: {}
concurrency:
  group: skyshift-main-qa-recovery-226
  cancel-in-progress: false
jobs:
  dispatch-main-qa:
    if: ${{ github.repository == 'Hajjen-Game/Hajjen' && github.event.pull_request.number == 226 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.sha == '1f3b6cd48a806b4799e223f8f7e069090c9d6846' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch existing Track QA only for the verified main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Hajjen-Game/Hajjen
          EXPECTED_MAIN: 1f3b6cd48a806b4799e223f8f7e069090c9d6846
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          test "$actual" = "$EXPECTED_MAIN"
          existing="$(gh api "repos/$GH_REPO/actions/workflows/skyshift-tests.yml/runs?branch=main&head_sha=$EXPECTED_MAIN" --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length')"
          if [ "$existing" -gt 0 ]; then
            echo "Exact main QA already running or successful."
          else
            gh workflow run skyshift-tests.yml --repo "$GH_REPO" --ref main
            echo "Requested existing main QA workflow; verify run SHA and result separately."
          fi
