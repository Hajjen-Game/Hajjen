name: SKYSHIFT fast PR checks
# SKYSHIFT CI Optimization 1.0
# A PR commit runs once (not also on branch push). Superseded commits are
# cancelled before they consume more CI minutes. Full historical visual QA is
# retained in skyshift-tests.yml and can be dispatched before any release.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-ci-fast.yml'
      - '.github/workflows/skyshift-tests.yml'

concurrency:
  group: skyshift-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-core:
    name: SKYSHIFT fast syntax, flight, solar seal & current metal unit gates
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and high-value flight/visual regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check skyshift/game-v0210.mjs
          node --check skyshift/boot-v0210.js
          node --check skyshift/dual-tone-lighting-v0260.mjs
          node --check skyshift/browser-dual-tone-lighting-v0260.mjs
          node --check skyshift/unified-tunnel-lighting-v1.mjs
          node --check skyshift/browser-unified-tunnel-lighting-v1.mjs
          node --check skyshift/cinematic-road-rebuild-v0263.mjs
          node --check skyshift/edge-lighting-floor-pools-v02631.mjs
          node --check skyshift/edge-source-floor-bands-v02632.mjs
          node --check skyshift/straight-only-edge-lighting-v02633.mjs
          node --check skyshift/final-cohesion-v0264.mjs
          node --check skyshift/unified-metal-light-response-v02641.mjs
          node --check skyshift/reflection-cohesion-v02642.mjs
          node --check skyshift/unified-fixture-transport-v02643.mjs
          node --check skyshift/true-rail-wall-response-v0265.mjs
          node --check skyshift/browser-rail-wall-v0265.mjs
          node --check skyshift/full-tunnel-layout-v0270.mjs
          node --check skyshift/full-tunnel-circuit-v0270.mjs
          node --check skyshift/full-tunnel-light-seal-v0270.mjs
          node --check skyshift/browser-full-tunnel-v0270.mjs
          node --check skyshift/vault-material-parity-v0271.mjs
          node --check skyshift/browser-vault-material-v0271.mjs
          node --check skyshift/browser-fixture-transport-v02643.mjs
          node --check skyshift/browser-reflection-cohesion-v02642.mjs
          node --check skyshift/browser-unified-metal-v02641.mjs
          node --check skyshift/browser-final-cohesion-v0264.mjs
          node --check skyshift/browser-straight-only-edge-v02633.mjs
          node --check skyshift/browser-edge-source-floor-bands-v02632.mjs
          node --check skyshift/browser-edge-floor-v02631.mjs
          node --check skyshift/browser-cinematic-road-rebuild-v0263.mjs
          node --check skyshift/premium-metal-surface-v0262.mjs
          node --check skyshift/browser-premium-metal-v0262.mjs
          node --check skyshift/local-reflections-v0261p1.mjs
          node --check skyshift/browser-local-reflections-v0261p1.mjs
          if [[ -f skyshift/true-metal-materials-v0260p2.mjs ]]; then
            node --check skyshift/true-metal-materials-v0260p2.mjs
            node --check skyshift/browser-true-metal-materials-v0260p2.mjs
          fi
          node --test \
            skyshift/track-physics-parity-v0165.test.mjs \
            skyshift/track-integrity-v0165.test.mjs \
            skyshift/grip-trick-lock-v0165.test.mjs \
            skyshift/white-core-containment-v02123.test.mjs \
            skyshift/rail-body-containment-v02124.test.mjs \
            skyshift/ship-white-spill-v02125.test.mjs \
            skyshift/road-solar-spill-v02126.test.mjs \
            skyshift/dark-metallic-foundation-v0250.test.mjs \
            skyshift/micro-surface-metal-definition-v0251.test.mjs \
            skyshift/dual-tone-lighting-v0260.test.mjs \
            skyshift/unified-tunnel-lighting-v1.test.mjs
          if [[ -f skyshift/true-metal-materials-v0260p2.test.mjs ]]; then
            node --test skyshift/true-metal-materials-v0260p2.test.mjs
            node --test skyshift/local-reflections-v0261p1.test.mjs
            node --test skyshift/premium-metal-surface-v0262.test.mjs
            node --test skyshift/cinematic-road-rebuild-v0263.test.mjs
            node --test skyshift/edge-lighting-floor-pools-v02631.test.mjs
            node --test skyshift/edge-source-floor-bands-v02632.test.mjs
            node --test skyshift/straight-only-edge-lighting-v02633.test.mjs
            node --test skyshift/final-cohesion-v0264.test.mjs
            node --test skyshift/unified-metal-light-response-v02641.test.mjs
            node --test skyshift/reflection-cohesion-v02642.test.mjs
            node --test skyshift/unified-fixture-transport-v02643.test.mjs
            node --test skyshift/true-rail-wall-response-v0265.test.mjs
            node --test skyshift/full-tunnel-layout-v0270.test.mjs
            node --test skyshift/full-tunnel-circuit-v0270.test.mjs
            node --test skyshift/full-tunnel-light-seal-v0270.test.mjs
            node --test skyshift/vault-material-parity-v0271.test.mjs
          fi
          # Prevent legacy push-only failure: Skyline's boot release and
          # Neon Vault's independent menu release must both be validated
          # on the PR, before merging to main.
          node --test skyshift/build-version-v02204.test.mjs

  current-material-webgl:
    name: SKYSHIFT current material REAL Chrome/WebGL, dual-tone and 4 GB
    needs: fast-core
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 pngjs@7.0.0
      - name: Verify latest metal pipeline in the real renderer
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f skyshift/browser-true-metal-materials-v0260p2.mjs ]]; then
            echo "QA: Pass 2 native physical metal, solar seal and same-camera comparison"
            node skyshift/browser-true-metal-materials-v0260p2.mjs
          else
            echo "QA: Pass 1 dual-tone lighting, solar seal and same-camera comparison"
            node skyshift/browser-dual-tone-lighting-v0260.mjs
          fi
          node skyshift/browser-unified-tunnel-lighting-v1.mjs
          node skyshift/browser-local-reflections-v0261p1.mjs
          node skyshift/browser-premium-metal-v0262.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyshift-ci-fast-current-metal-visual-proof
          path: |
            skyshift-v0260p2-*.png
            skyshift-v0260p2-proof.json
            skyshift-v0260-*.png
            skyshift-v0260-proof.json
            skyshift-unified-lighting-v1-*.png
            skyshift-unified-lighting-v1-proof.json
            skyshift-v0261p1-*.png
            skyshift-v0261p1-proof.json
            skyshift-v0262-*.png
            skyshift-v0262-proof.json
          if-no-files-found: warn

