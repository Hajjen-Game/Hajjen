name: SKYSHIFT EF02 road deck parity
on:
  pull_request:
    paths:
      - 'skyshift/smooth-track-v084.mjs'
      - 'skyshift/smooth-track-v0901.mjs'
      - 'skyshift/smooth-track-v0160.mjs'
      - 'skyshift/tracks/shared/smooth-deck.mjs'
      - 'skyshift/tests/architecture/ef02-deck-parity.mjs'
      - '.github/workflows/skyshift-ef02-deck-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deck-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare current track adapters to exact EF01 reference
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4983f20f6cf867f91e1ebd57ad48b1d0c685997c
          git worktree add --detach "$RUNNER_TEMP/ef02-reference" 4983f20f6cf867f91e1ebd57ad48b1d0c685997c
          for track in skyline vault aurora; do
            node skyshift/tests/architecture/ef02-deck-parity.mjs "$RUNNER_TEMP/ef02-reference" "$track"
          done
