name: Build PvP 2.5D custom mini heroes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-pvp25d-miniheroes.yml"
      - "pvp-25d/tools/miniheroes/**"

permissions:
  contents: write

concurrency:
  group: build-pvp25d-miniheroes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Generate custom PvP 2.5D heroes
        shell: bash
        run: |
          set -euxo pipefail
          out="$PWD/pvp-25d/assets/characters/miniheroes"
          mkdir -p "$out"

          for variant in caster rogue warrior; do
            blender -b --python pvp-25d/tools/miniheroes/build_minihero.py --               "$variant" "$out/minihero-$variant.glb"
            test -s "$out/minihero-$variant.glb"
          done

          ls -lh "$out"

      - name: Commit generated GLBs
        shell: bash
        run: |
          set -euo pipefail
          git add pvp-25d/assets/characters/miniheroes/*.glb
          if git diff --cached --quiet; then
            echo "Generated mini heroes are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate custom mini heroes for PvP 2.5D"
          git push
