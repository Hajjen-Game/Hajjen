  browser-smoke:
    name: Premium material WebGL smoke
    needs: track-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Render SKYSHIFT 0.9.1 Signature Flight Motion in real Chrome WebGL and Android touch
        run: node skyshift/browser-smoke-v091.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyshift-v082-3d-track-evolution
          path: |
            skyshift-v082-first-wave.png
            skyshift-v082-final-wave.png
          if-no-files-found: ignore
