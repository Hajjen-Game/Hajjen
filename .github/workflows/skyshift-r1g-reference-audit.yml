name: SKYSHIFT R1G reference audit
on:
  push:
    branches:
      - 'skyshift/root-consolidation-r1g-reference-audit'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all 43 remaining candidate snapshots and tracked references
        run: node skyshift/tests/architecture/r1g-reference-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: skyshift-r1g-reference-audit
          path: r1g-audit.json
          if-no-files-found: error
