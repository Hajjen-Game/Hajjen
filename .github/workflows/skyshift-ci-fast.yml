            node --test skyshift/tests/unit/full-tunnel-circuit-v0270.test.mjs
            node --test skyshift/tests/unit/full-tunnel-light-seal-v0270.test.mjs
            node --test skyshift/tests/unit/vault-material-parity-v0271.test.mjs
            node --test skyshift/tests/unit/vault-architectural-parity-v0272.test.mjs
            node --test skyshift/tests/unit/vault-full-lighting-v0273.test.mjs
            node --test skyshift/tests/unit/vault-premium-finish-v0274.test.mjs
            node --test skyshift/tests/unit/shared-tunnel-architecture-v0280.test.mjs
            node --test skyshift/tests/unit/true-shared-tunnel-renderer-v0281.test.mjs
            node --test skyshift/tests/unit/shared-road-ship-light-v0282.test.mjs
            node --test skyshift/tests/unit/vault-boost-clarity-v0283.test.mjs
            node --test skyshift/tests/unit/pmrem-reflection-pipeline-v0284.test.mjs
            node --test skyshift/tests/unit/vault-spatial-wave-parity-v0285.test.mjs
            node --test skyshift/tests/unit/reflection-stability-strips-v0286.test.mjs
            node --test skyshift/tests/unit/arch-foot-light-assembly-v0287.test.mjs
          fi
          # Prevent legacy push-only failure: Skyline's boot release and
          # Neon Vault's independent menu release must both be validated
          # on the PR, before merging to main.
          node --test skyshift/tests/unit/ceiling-fixture-cohesion-v02892.test.mjs
          node --test skyshift/tests/unit/premium-arch-optics-v02893.test.mjs
          node --test skyshift/tests/unit/unified-tunnel-light-sources-v02894.test.mjs
