name: SKYSHIFT architecture safety guard
# Independent, no-runtime-change guard for safe repository consolidation.
on:
  pull_request:
    paths:
      - 'skyshift/**'
      - '.github/workflows/skyshift-architecture-guard.yml'
      - '.github/workflows/skyshift-ci-fast.yml'
      - '.github/workflows/skyshift-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-entrypoint-graph:
    name: Validate live SKYSHIFT HTML and reachable module paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned legacy rollback commit
        run: |
          git fetch --no-tags --depth=1 origin 06754fc69e87b23e63b73e1552f99883fadc3897
          git fetch --no-tags --depth=1 origin 89b1ca990b72a3321303585fa48b924b3e04ed5e
      - name: Check active bootstrap and relative imports
        run: | 
          node --test skyshift/tests/architecture/active-entrypoint.test.mjs
          node --test skyshift/tests/architecture/ef04-race-simulation.test.mjs
          node --test skyshift/tests/architecture/ef06-runtime-lifetime.test.mjs
          node --test skyshift/tests/architecture/release-archive-integrity.test.mjs
      - name: Verify retired entry sources and exact historical reader compatibility
        run: node --test skyshift/tests/architecture/ef08-retired-entry-sources.test.mjs
      - name: Verify consolidated current ownership and dependency contracts
        run: node --test skyshift/tests/architecture/ef08-current-contracts.test.mjs
      - name: Syntax-check retained browser QA runners
        run: |
          for file in skyshift/tests/browser/browser-*.mjs; do node --check "$file"; done
      - name: Validate current test dependencies and workflow paths
        run: node --test skyshift/tests/architecture/current-unit-dependency-integrity.test.mjs
      - name: Run relocated early flight/fullscreen unit tests
        run: node --test skyshift/tests/unit/fullscreen-v02.test.mjs skyshift/tests/unit/trial-v02.test.mjs skyshift/tests/unit/trial-v03.test.mjs
      - name: Run retained unit regressions
        run: |
          node --test skyshift/tests/unit/performance-audit-v0110.test.mjs skyshift/tests/unit/render-optimizer-v0111.test.mjs skyshift/tests/unit/cinematic-space-lighting-v0170.test.mjs skyshift/tests/unit/ship-hero-loader-v01342.test.mjs skyshift/tests/unit/unified-flight-v0112.test.mjs skyshift/tests/unit/visual-fidelity-v0113.test.mjs skyshift/tests/unit/visual-fidelity-v0114.test.mjs skyshift/tests/unit/track.test.mjs
      - name: Run exact neon interior post-merge unit regression before merge
        run: node --test skyshift/tests/unit/neon-interior-v0212.test.mjs
      - name: Validate CI 2.0 change classifier and fail-safe cases
        run: node --test skyshift/tests/architecture/ci-change-scope-v2.test.mjs
      - name: Stage M audit 16 immutable world modules, glTF URL parity and historical references
        run: node --test skyshift/tests/architecture/station-world-migration-stageM.test.mjs
      - name: Inventory next large root subsystem relocation cohort (read-only)
        run: node skyshift/tests/architecture/root-subsystem-relocation-plan.mjs
      - name: Run exact post-merge track logic unit suite before merge
        run: |
          qa_dir="$(mktemp -d "$RUNNER_TEMP/skyshift-track-qa.XXXXXX")"
          qa_tree="$qa_dir/checkout"
          cleanup() {
            git worktree remove --force "$qa_tree"
            rmdir "$qa_dir"
          }
          git worktree add --detach "$qa_tree" HEAD
          trap cleanup EXIT
          (
            cd "$qa_tree"
            node skyshift/build/archived-world-assets.mjs --materialize
            node --test skyshift/tests/unit/environment-art-pipeline-v0205.test.mjs skyshift/tests/unit/environment-art-pipeline-v02041.test.mjs skyshift/tests/unit/environment-art-pipeline-v0204.test.mjs skyshift/tests/unit/environment-art-pipeline-v0203.test.mjs skyshift/tests/unit/environment-art-pipeline-v02021.test.mjs skyshift/tests/unit/environment-art-pipeline-v0202.test.mjs skyshift/tests/unit/environment-art-pipeline-v0201.test.mjs skyshift/tests/unit/environment-art-pipeline-v0200.test.mjs skyshift/tests/unit/orbital-hero-v0192.test.mjs skyshift/tests/unit/world-rebuild-v0190.test.mjs skyshift/tests/unit/signature-environment-v0180.test.mjs skyshift/tests/unit/cinematic-space-lighting-v0170.test.mjs skyshift/tests/unit/track.test.mjs skyshift/tests/unit/trial-v02.test.mjs skyshift/tests/unit/handling-fairness-v0135.test.mjs skyshift/tests/unit/track-integrity-v0165.test.mjs skyshift/tests/unit/track-physics-parity-v0165.test.mjs skyshift/tests/unit/grip-trick-lock-v0165.test.mjs skyshift/tests/unit/ship-hero-loader-v01342.test.mjs skyshift/tests/unit/ship-art-pipeline-v0132.test.mjs skyshift/tests/unit/stingray-hero-preview-v01321.test.mjs skyshift/tests/unit/time-trial-v0130.test.mjs skyshift/tests/unit/racing-experience-v0120.test.mjs skyshift/tests/unit/racing-experience-v0121.test.mjs skyshift/tests/unit/performance-audit-v0110.test.mjs skyshift/tests/unit/render-optimizer-v0111.test.mjs skyshift/tests/unit/unified-flight-v0112.test.mjs skyshift/tests/unit/visual-fidelity-v0113.test.mjs skyshift/tests/unit/visual-fidelity-v0114.test.mjs
          )
      - name: Syntax-check the migrated historical test collection without changing its original assertions
        run: |
          for file in skyshift/tests/unit/*.test.mjs; do node --check "$file"; done

