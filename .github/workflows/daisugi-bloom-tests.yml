name: Japanese Harmony & legacy checks
on:
  push:
    paths:
      - daisugi-bloom/**
      - .github/workflows/daisugi-bloom-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate legacy Daisugi rules
        run: node daisugi-bloom/tests/rules.test.cjs
      - name: Validate Japanese Harmony puzzle rules
        run: node daisugi-bloom/tests/harmony.test.cjs
      - name: Audit all ten Harmony levels with seeded invariants
        run: node daisugi-bloom/tests/harmony-consistency-audit.test.cjs
      - name: Verify Japanese Harmony 4.1 visual-feedback contracts
        run: node daisugi-bloom/tests/harmony-vfx.test.cjs
      - name: Verify Harmony 4.2 audio and reward limits
        run: node daisugi-bloom/tests/harmony-audio.test.cjs
      - name: Verify Harmony 4.2 score animation and reset contracts
        run: node daisugi-bloom/tests/harmony-reward.test.cjs
      - name: Verify 4.3 mobile frame meter and adaptive decorative FX
        run: node daisugi-bloom/tests/harmony-performance.test.cjs
      - name: Verify visible fusion gathering and masterpiece release
        run: node daisugi-bloom/tests/harmony-fusion-motion.test.cjs
      - name: Verify seeded Engine Lab bots, metrics and no save mutation
        run: node daisugi-bloom/tests/harmony-engine-lab.test.cjs
      - name: Verify Balanced Refill and Fair Shuffle 2.0
        run: node daisugi-bloom/tests/harmony-refill-shuffle.test.cjs
      - name: Verify Opportunity Director 1.0 and paired A/B diagnostics
        run: node daisugi-bloom/tests/harmony-opportunity-director.test.cjs
      - name: Verify opt-in Director 2.0 conservation, drought and paired A/B/C
        run: node daisugi-bloom/tests/harmony-opportunity-director-v2.test.cjs
      - name: Verify Pacing Director 3.0 move timing, conservation, save/load and paired A/B/C/D
        run: node daisugi-bloom/tests/harmony-pacing-director-v3.test.cjs
      - name: Verify Four Families Experiment 1.0 board, save compatibility and Director 3.0
        run: node daisugi-bloom/tests/harmony-four-families.test.cjs
      - name: Verify Harmony Resonance Echo scoring, sound isolation and saved states
        run: node daisugi-bloom/tests/harmony-resonance.test.cjs
      - name: Syntax-check calibration benchmark
        run: node --check daisugi-bloom/tools/harmony-difficulty-reward-benchmark.cjs
      - name: Syntax-check all browser scripts
        run: |
          node --check daisugi-bloom/src/rules.js
          node --check daisugi-bloom/src/visuals.js
          node --check daisugi-bloom/src/app.js
          node --check daisugi-bloom/harmony/rules.js
          node --check daisugi-bloom/harmony/performance.js
          node --check daisugi-bloom/harmony/audio.js
          node --check daisugi-bloom/harmony/diagnostics.js
          node --check daisugi-bloom/tools/harmony-engine-benchmark.cjs
          node --check daisugi-bloom/tools/opportunity-director-v2-benchmark.cjs
          node --check daisugi-bloom/tools/harmony-score-calibration.cjs
          node --check daisugi-bloom/tools/harmony-pacing-3-benchmark.cjs
          node --check daisugi-bloom/tools/harmony-four-families-benchmark.cjs
          node --check daisugi-bloom/tools/harmony-objective-balance.cjs
          node --check daisugi-bloom/harmony/app.js
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24.11.0
      - name: Start local static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/daisugi-bloom-server.log 2>&1 &
          echo $! > /tmp/daisugi-bloom-server.pid
      - name: Run Japanese Harmony mobile smoke
        run: node daisugi-bloom/tests/harmony-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daisugi-bloom-mobile-preview
          path: /tmp/daisugi-bloom/*.png
          if-no-files-found: ignore

  objectives-rebalance-benchmark:
    name: Journey Objectives 1.0 · 160 seeded challenge comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compare goal-oriented and random bots on levels 11–20
        run: node daisugi-bloom/tools/harmony-objective-balance.cjs
      - name: Retain target, budget, wins and per-game seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-harmony-objectives-rebalance-1-0
          path: daisugi-bloom/reports/objectives-rebalance-1.0-benchmark.json
          if-no-files-found: ignore

  director2-benchmark:
    name: Director 2.0 · 480 seeded gameplay comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce 480 real Standard / Director 1.0 / Director 2.0 games
        run: node daisugi-bloom/tools/opportunity-director-v2-benchmark.cjs
      - name: Preserve full report and per-game seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-harmony-director2-benchmark
          path: daisugi-bloom/reports/opportunity-director-2-benchmark.json
          if-no-files-found: warn

  score-calibration:
    name: Journey Stars 6.15 · 330 complete-length games
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compare one / two / three star thresholds on 330 full-score games
        run: node daisugi-bloom/tools/harmony-score-calibration.cjs
      - name: Retain score calibration results with exact seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-harmony-journey-stars-6-15
          path: daisugi-bloom/reports/score-stars-6.15-benchmark.json
          if-no-files-found: warn

  pacing3-benchmark:
    name: Pacing Director 3.0 · 480 paired game simulations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compare 480 Standard / Director 1.0 / 2.0 / 3.0 games
        run: node daisugi-bloom/tools/harmony-pacing-3-benchmark.cjs
      - name: Save scored rounds and seeded synthetic timing patterns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-harmony-pacing-3-benchmark
          path: daisugi-bloom/reports/harmony-pacing-director-3-benchmark.json
          if-no-files-found: warn

  four-families-benchmark:
    name: Four Families Experiment 1.0 · 480 full game comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compare 480 seeded full-length games with 4 vs 5 families
        run: node daisugi-bloom/tools/harmony-four-families-benchmark.cjs
      - name: Save per-game Masterpieces, Harmony Echo and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-harmony-four-families-benchmark
          path: daisugi-bloom/reports/four-families-1-0-benchmark.json
          if-no-files-found: warn

  difficulty-reward-benchmark:
    name: Difficulty & Reward 1.0 · first 20 level simulations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sample 400 full objective-based games and star ratings
        run: node daisugi-bloom/tools/harmony-difficulty-reward-benchmark.cjs
      - name: Preserve per-game seeds and calibration outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-harmony-difficulty-reward-1-0
          path: daisugi-bloom/reports/difficulty-reward-1.0-benchmark.json
          if-no-files-found: warn
