name: Import CC0 Weapon Slash for Wildpath
on:
  push:
    paths:
      - .github/workflows/wildpath-weapon-slash.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-slash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install sprite image decoder
        run: python -m pip install --quiet Pillow
      - name: Download original CC0 sprites and record layout
        run: |
          python - <<'PY'
          import io,zipfile,urllib.request,pathlib,hashlib,json,re
          from PIL import Image
          url='https://opengameart.org/sites/default/files/Classic.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'WildpathGame/1.0 (CC0 asset import)'})
          data=urllib.request.urlopen(req,timeout=45).read()
          z=zipfile.ZipFile(io.BytesIO(data))
          root=pathlib.Path('wildpath/assets/weapon-slash')
          root.mkdir(parents=True,exist_ok=True)
          records=[]
          for name in z.namelist():
            if name.lower().endswith(('.png','.gif','.webp')) and not name.endswith('/'):
              raw=z.read(name)
              try:
                img=Image.open(io.BytesIO(raw)).convert('RGBA')
              except Exception as exc:
                print('SKIP',name,exc);continue
              safe=re.sub(r'[^a-zA-Z0-9._-]','_',name.replace('/','__'))
              out=root/safe
              img.save(out,optimize=True)
              records.append({'file':safe,'source':name,'width':img.width,'height':img.height})
              print('ASSET',name,img.size,'=>',str(out))
          if not records: raise RuntimeError('No sprites in original Classic.zip')
          (root/'manifest.json').write_text(json.dumps({
            'source':'https://opengameart.org/content/weapon-slash-effect',
            'author':'Cethiel','license':'CC0-1.0',
            'original_archive_sha256':hashlib.sha256(data).hexdigest(),
            'files':records
          },indent=2)+'\n')
          (root/'LICENSE.txt').write_text('Weapon Slash - Effect by Cethiel, CC0 1.0.\nhttps://opengameart.org/content/weapon-slash-effect\nhttps://creativecommons.org/publicdomain/zero/1.0/\n')
          print('COUNT',len(records))
          PY
      - name: Commit original slash image sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wildpath/assets/weapon-slash
          if ! git diff --cached --quiet; then
            git commit -m "assets(wildpath): import Cethiel Weapon Slash CC0 sprites"
            git push
          fi
