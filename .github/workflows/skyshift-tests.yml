name: SKYSHIFT track logic checks
# CI Optimization 2.0: automatic full historical QA only for runtime and CI changes.
# Manual release audits remain available through workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'skyshift/**'
      - '!skyshift/tests/**'
      - '!skyshift/docs/**'
      - '!skyshift/previews/**'
      - '!skyshift/*.md'
      - '.github/workflows/skyshift-tests.yml'
      - '.github/workflows/skyshift-ci-fast.yml'
  workflow_dispatch:
# Release checks on main must finish. Supersede old manual runs on a
# development branch when testing a newer commit there.
concurrency:
  group: skyshift-full-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  true-metal-v0260p2-unit:
    name: SKYSHIFT 0.26.0 P2 native metal GGX, local lights & solar isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real MeshPhysicalMaterial, shader and solar/flight safeguards
        run: |
          node --check skyshift/rendering/true-metal-materials-v0260p2.mjs
          node --check skyshift/browser-true-metal-materials-v0260p2.mjs
          node --check skyshift/game-v0210.mjs
          node --check skyshift/boot-v0210.js
          node --test skyshift/tests/unit/true-metal-materials-v0260p2.test.mjs
          node --check skyshift/unified-tunnel-lighting-v1.mjs
          node --check skyshift/browser-unified-tunnel-lighting-v1.mjs
          node --test skyshift/tests/unit/unified-tunnel-lighting-v1.test.mjs
          node --check skyshift/rendering/local-reflections-v0261p1.mjs
          node --check skyshift/tests/browser/browser-local-reflections-v0261p1.mjs
          node --test skyshift/tests/unit/local-reflections-v0261p1.test.mjs
          node --check skyshift/cinematic-road-rebuild-v0263.mjs
          node --check skyshift/tests/browser/browser-cinematic-road-rebuild-v0263.mjs
          node --test skyshift/tests/unit/cinematic-road-rebuild-v0263.test.mjs
          node --check skyshift/edge-lighting-floor-pools-v02631.mjs
          node --check skyshift/edge-source-floor-bands-v02632.mjs
          node --check skyshift/straight-only-edge-lighting-v02633.mjs
          node --check skyshift/rendering/final-cohesion-v0264.mjs
          node --check skyshift/rendering/unified-metal-light-response-v02641.mjs
          node --check skyshift/rendering/reflection-cohesion-v02642.mjs
          node --check skyshift/rendering/unified-fixture-transport-v02643.mjs
          node --check skyshift/true-rail-wall-response-v0265.mjs
          node --check skyshift/browser-rail-wall-v0265.mjs
          node --check skyshift/tracks/vault/full-tunnel-layout-v0270.mjs
          node --check skyshift/tracks/vault/full-tunnel-circuit-v0270.mjs
          node --check skyshift/full-tunnel-light-seal-v0270.mjs
          node --check skyshift/tests/browser/browser-full-tunnel-v0270.mjs
          node --check skyshift/tracks/vault/vault-material-parity-v0271.mjs
          node --check skyshift/browser-vault-material-v0271.mjs
          node --check skyshift/tracks/vault/vault-architectural-parity-v0272.mjs
          node --check skyshift/browser-vault-architecture-v0272.mjs
          node --check skyshift/tracks/vault/vault-full-lighting-v0273.mjs
          node --check skyshift/browser-vault-lighting-v0273.mjs
          node --check skyshift/tracks/vault/vault-premium-finish-v0274.mjs
          node --check skyshift/browser-vault-premium-finish-v0274.mjs
          node --check skyshift/shared-tunnel-architecture-v0280.mjs
          node --check skyshift/shared-tunnel-runtime-v0280.mjs
          node --check skyshift/browser-shared-tunnel-v0280.mjs
          node --check skyshift/tests/browser/browser-fixture-transport-v02643.mjs
          node --check skyshift/browser-reflection-cohesion-v02642.mjs
          node --check skyshift/browser-unified-metal-v02641.mjs
          node --check skyshift/tests/browser/browser-final-cohesion-v0264.mjs
          node --check skyshift/browser-straight-only-edge-v02633.mjs
          node --check skyshift/tests/browser/browser-edge-source-floor-bands-v02632.mjs
          node --check skyshift/tests/browser/browser-edge-floor-v02631.mjs
          node --test skyshift/tests/unit/edge-lighting-floor-pools-v02631.test.mjs
          node --test skyshift/tests/unit/edge-source-floor-bands-v02632.test.mjs
          node --test skyshift/tests/unit/straight-only-edge-lighting-v02633.test.mjs
          node --test skyshift/tests/unit/final-cohesion-v0264.test.mjs
          node --test skyshift/tests/unit/unified-metal-light-response-v02641.test.mjs
          node --test skyshift/tests/unit/reflection-cohesion-v02642.test.mjs
          node --test skyshift/tests/unit/unified-fixture-transport-v02643.test.mjs
          node --test skyshift/tests/unit/true-rail-wall-response-v0265.test.mjs
          node --test skyshift/tests/unit/full-tunnel-layout-v0270.test.mjs
          node --test skyshift/tests/unit/full-tunnel-circuit-v0270.test.mjs
          node --test skyshift/tests/unit/full-tunnel-light-seal-v0270.test.mjs
          node --test skyshift/tests/unit/vault-material-parity-v0271.test.mjs
          node --test skyshift/tests/unit/vault-architectural-parity-v0272.test.mjs
          node --test skyshift/tests/unit/vault-full-lighting-v0273.test.mjs
          node --test skyshift/tests/unit/vault-premium-finish-v0274.test.mjs
          node --test skyshift/tests/unit/shared-tunnel-architecture-v0280.test.mjs

  # The old 12-minute job ran NINE full Chromium/SwiftShader sessions
  # sequentially. On 2026-11-21 it completed 7/9 successfully, then
  # GitHub canceled it at 12m before Pass 4 and 0.26.4.1 could start.
  # Split by concern: each independent suite can run in parallel after
  # the same unchanged native-GGX/solar/flight unit gate.
  browser-true-metal-v0260p2:
    name: SKYSHIFT historic PBR metal / black-room / local-strip WebGL 8GB + 4GB
    needs: true-metal-v0260p2-unit
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install chromium test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 pngjs@7.0.0
      - name: Real physical metal, shared dark room and finite-strip GGX checks
        run: |
          node skyshift/browser-true-metal-materials-v0260p2.mjs
          node skyshift/browser-unified-tunnel-lighting-v1.mjs
          node skyshift/tests/browser/browser-local-reflections-v0261p1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyshift-historic-physical-metal-webgl-proof
          path: |
            skyshift-v0260p2-*.png
            skyshift-v0260p2-proof.json
            skyshift-unified-lighting-v1-*.png
            skyshift-unified-lighting-v1-proof.json
            skyshift-v0261p1-*.png
            skyshift-v0261p1-proof.json
          if-no-files-found: warn

  browser-road-edge-historical:
    name: SKYSHIFT historic road GGX / connected floor / straight-only edges 8GB + 4GB
    needs: true-metal-v0260p2-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install chromium test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 pngjs@7.0.0
      - name: Real roadway, foot pools, lower rail and NO light in chevron turns
        run: |
          node skyshift/tests/browser/browser-cinematic-road-rebuild-v0263.mjs
          node skyshift/tests/browser/browser-edge-floor-v02631.mjs
          node skyshift/tests/browser/browser-edge-source-floor-bands-v02632.mjs
          node skyshift/browser-straight-only-edge-v02633.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyshift-historic-road-edge-webgl-proof
          path: |
            skyshift-v0263-*.png
            skyshift-v0263-proof.json
            skyshift-v02631-*.png
            skyshift-v02631-proof.json
            skyshift-v02632-*.png
            skyshift-v02632-proof.json
            skyshift-v02633-*.png
            skyshift-v02633-proof.json
          if-no-files-found: warn

  browser-finish-metal-historical:
    name: SKYSHIFT Pass 4 and 0.26.4.1 HDR / dark titanium REAL WebGL 8GB + 4GB
    needs: true-metal-v0260p2-unit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install chromium test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 pngjs@7.0.0
      - name: Verify final optical HDR and new titanium response independently
        run: |
          node skyshift/tests/browser/browser-final-cohesion-v0264.mjs
          node skyshift/browser-unified-metal-v02641.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyshift-historic-final-light-titanium-webgl-proof
          path: |
            skyshift-v0264-*.png
            skyshift-v0264-proof.json
            skyshift-v02641-*.png
            skyshift-v02641-proof.json
          if-no-files-found: warn

