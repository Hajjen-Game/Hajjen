name: Japanese Harmony & legacy checks
on:
  push:
    paths:
      - daisugi-bloom/**
      - .github/workflows/daisugi-bloom-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate legacy Daisugi rules
        run: node daisugi-bloom/tests/rules.test.cjs
      - name: Validate Japanese Harmony puzzle rules
        run: node daisugi-bloom/tests/harmony.test.cjs
      - name: Verify Japanese Harmony 4.1 visual-feedback contracts
        run: node daisugi-bloom/tests/harmony-vfx.test.cjs
      - name: Verify Harmony 4.2 audio and reward limits
        run: node daisugi-bloom/tests/harmony-audio.test.cjs
      - name: Verify Harmony 4.2 score animation and reset contracts
        run: node daisugi-bloom/tests/harmony-reward.test.cjs
      - name: Verify 4.3 mobile frame meter and adaptive decorative FX
        run: node daisugi-bloom/tests/harmony-performance.test.cjs
      - name: Verify visible fusion gathering and masterpiece release
        run: node daisugi-bloom/tests/harmony-fusion-motion.test.cjs
      - name: Verify seeded Engine Lab bots, metrics and no save mutation
        run: node daisugi-bloom/tests/harmony-engine-lab.test.cjs
      - name: Syntax-check all browser scripts
        run: |
          node --check daisugi-bloom/src/rules.js
          node --check daisugi-bloom/src/visuals.js
          node --check daisugi-bloom/src/app.js
          node --check daisugi-bloom/harmony/rules.js
          node --check daisugi-bloom/harmony/performance.js
          node --check daisugi-bloom/harmony/audio.js
          node --check daisugi-bloom/harmony/diagnostics.js
          node --check daisugi-bloom/tools/harmony-engine-benchmark.cjs
          node --check daisugi-bloom/harmony/app.js
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24.11.0
      - name: Start local static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/daisugi-bloom-server.log 2>&1 &
          echo $! > /tmp/daisugi-bloom-server.pid
      - name: Run Japanese Harmony mobile smoke
        run: node daisugi-bloom/tests/harmony-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daisugi-bloom-mobile-preview
          path: /tmp/daisugi-bloom/*.png
          if-no-files-found: ignore
